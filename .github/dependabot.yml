version: 2
# One grouped PR per ecosystem a week, and only for releases at least two
# weeks old, so a broken or pulled release has time to show.
updates:
  - package-ecosystem: npm
    directory: "/site"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      site:
        patterns: ["*"]
    open-pull-requests-limit: 5
  - package-ecosystem: gomod
    directory: "/go"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      go:
        patterns: ["*"]
    open-pull-requests-limit: 5
  # The workflows pin actions by commit; this keeps the pins moving.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
    open-pull-requests-limit: 5
