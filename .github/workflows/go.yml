name: Go

on:
  pull_request:
  # The renewal pushes its record branch with the release token and opens
  # the PR with the job token, which starts no workflows: the push runs the
  # required checks for it.
  push:
    branches: [main, "bot/tuf-timestamp-v*"]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR replaces its run; runs on main always finish.
concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: go / test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Test with the race detector
        run: go test -race ./...
      # The release builds these same five targets; a cross-compile error
      # must not wait for release day.
      - name: Build every release target
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          for target in darwin-arm64 darwin-amd64 linux-amd64 linux-arm64 windows-amd64; do
            GOOS=${target%-*} GOARCH=${target#*-} go build -trimpath -o /dev/null ./cmd/x86qw
          done

  test-windows:
    name: go / test windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go
    steps:
      # The tests compare checked-in documents byte for byte.
      - name: Keep LF line endings
        working-directory: .
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - run: go test ./...
