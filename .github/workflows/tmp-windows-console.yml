name: Windows console check (temporary)

on:
  push:
    branches: [fix/audit-findings]

permissions:
  contents: read

jobs:
  console:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go test -count=1 -v -run "TestServersOpenNoConsoleWindow|TestTheSupervisorStopsOnSIGTERM|TestAFailedSwapPutsTheRunningCLIBack|TestJournalPathsStayInside" ./internal/services ./internal/cli
