name: Monitor public TUF lease

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: tuf-monitor
  cancel-in-progress: true

jobs:
  public-tuf:
    name: Authenticate public TUF and check lease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          lfs: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned trust dependencies from vendored wheels
        run: python -m pip install --no-index --find-links maintenance/vendor/wheels --require-hashes -r maintenance/requirements-trust.txt
      - name: Check authenticated public lease
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python maintenance/tools/monitor_public_tuf.py --root maintenance/trust/root.json --warning-hours 72
      - name: Fail closed if the monitor itself went stale
        # A manual run is the explicit recovery path after a cadence incident:
        # the authenticated lease check above must pass, then this run becomes
        # the fresh successful baseline consumed by the next scheduled run.
        if: success() && github.event_name == 'schedule'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const maxGapHours = 4;
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'tuf-monitor.yml',
              status: 'success',
              per_page: 10,
            });
            const previous = data.workflow_runs.find((run) => run.id !== context.runId);
            if (!previous) {
              core.info('no previous successful monitor run; skipping staleness check');
              return;
            }
            const ageHours = (Date.now() - Date.parse(previous.updated_at)) / 3600000;
            if (ageHours > maxGapHours) {
              core.setFailed(
                `monitor gap: last success was ${ageHours.toFixed(2)}h ago (run ${previous.id}), max ${maxGapHours}h`
              );
            } else {
              core.info(`monitor cadence ok: last success ${ageHours.toFixed(2)}h ago`);
            }
      - name: Record one actionable TUF lease alert
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const marker = '<!-- x86qw-tuf-lease-alert -->';
            const title = 'TUF public lease requires attention';
            const labels = ['P0', 'owner-only'];
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              'The scheduled public TUF monitor failed, found a lease inside the 72-hour warning window, or detected a gap since the last successful run.',
              '',
              `Workflow run: ${runUrl}`,
              `Commit: ${context.sha}`,
              '',
              'Inspect the authenticated metadata and follow the TUF renewal/recovery runbook. Do not renew or publish from this alert automatically.',
            ].join('\n');
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'P0',
              per_page: 100,
            });
            const existing = openIssues.find((issue) => (
              !issue.pull_request
              && typeof issue.body === 'string'
              && issue.body.includes(marker)
            ));
            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body,
                labels,
              });
              core.info(`Updated TUF lease alert issue #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels,
              });
              core.info(`Created TUF lease alert issue #${created.number}`);
            }
