name: End-to-end

# Installs for real every night on Linux and macOS:
# - the Go network tests: the catalog over TUF, an essential install,
#   cancel and retry, match resolution, host instances;
# - the served install.sh bootstrap, from the checkout.
# Windows has its own workflow, because the site challenges GitHub's
# Windows runners.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "site/public/install.sh"
      - "go/cmd/x86qw-release/templates/install.sh"

permissions:
  contents: read

jobs:
  e2e:
    name: e2e ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Network and real-install tests
        working-directory: go
        env:
          X86QW_NETWORK_TESTS: "1"
          X86QW_REAL_INSTALL: "1"
          X86QW_NO_MACOS_PREFERENCES: "1"
        run: go test -count=1 -timeout 45m ./internal/setup/... ./cmd/x86qw/...
      - name: The served install.sh installs, and this branch's CLI adopts it
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/x86qw"
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get install -y -qq xdg-utils shared-mime-info strace >/dev/null
            integrate=path,shortcuts,qw-links,demos
          else
            integrate=path,qw-links,demos
          fi
          bash site/public/install.sh --target "$target" --profile essential
          # The published CLI integrates the installation, so the adoption
          # below has to move what it made to the CLI at the root.
          "$target/x86qw.sh" setup --target "$target" --intent play --nick tester --content essential \
            --integrate "$integrate" --yes
          # A real version: a development build never replaces an installed CLI.
          go -C go build -ldflags "-X github.com/x86dx2/x86qw/go/internal/buildinfo.Version=9.9.9-e2e" -o "$RUNNER_TEMP/x86qw-branch" ./cmd/x86qw
          "$RUNNER_TEMP/x86qw-branch" setup --target "$target"
          # Everything runs the binary at the root; the old launchers are gone.
          test -x "$target/x86qw"
          test ! -e "$target/x86qw.sh"
          test ! -e "$target/.x86qw/cli/x86qw"
          test "$(cd "$(dirname "$(readlink "$HOME/.local/bin/x86qw")")" && pwd -P)/x86qw" = "$(cd "$target" && pwd -P)/x86qw"
          if [ "$RUNNER_OS" = Linux ]; then
            for entry in x86qw.desktop x86qw-open.desktop; do
              grep -F "Exec=$target/x86qw " "$HOME/.local/share/applications/$entry"
              ! grep -F x86qw.sh "$HOME/.local/share/applications/$entry"
            done
          else
            script="$(osadecompile "$target/.x86qw/handlers/x86QW.app/Contents/Resources/Scripts/main.scpt")"
            echo "$script" | grep -F "\"$target/x86qw\""
            ! echo "$script" | grep -F x86qw.sh
          fi
          "$HOME/.local/bin/x86qw" verify --target "$target"
          "$target/x86qw" doctor
      - name: Links and demos open through the system's handlers
        env:
          LINK: qw://2@qtv.example.org:28000/qtvplay
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/x86qw"
          # The handlers the published CLI made, as the adoption moved them.
          demo="$RUNNER_TEMP/final.mvd"
          printf 'demo bytes' > "$demo"
          if [ "$RUNNER_OS" = macOS ]; then
            # Launch Services hands the demo and the link to the applet, as
            # a click does; the link reaches ezQuake as +qwurl.
            open "$demo"
            open "$LINK"
            for _ in $(seq 120); do
              ps -axo command | grep -F -- "+qwurl $LINK" | grep -v grep && break
              sleep 0.25
            done
            ps -axo command | grep -F -- "+qwurl $LINK" | grep -qv grep
          else
            # xdg-open runs the registered entry for the link, as a click
            # does; it only looks up scheme handlers when DISPLAY is set, as
            # in a desktop session. strace records the ezQuake it starts,
            # which exits at once: there is no X server behind DISPLAY.
            DISPLAY=:0 timeout 60 strace -f -qq -e trace=execve -s 256 -o "$RUNNER_TEMP/link.trace" xdg-open "$LINK" || true
            grep -F -- "\"+qwurl\", \"$LINK\"" "$RUNNER_TEMP/link.trace"
            # The command the desktop entry registers, as xdg-open runs it,
            # with --dry-run so no ezQuake starts on the runner.
            handler="$(xdg-mime query default x-scheme-handler/qw)"
            test "$handler" = x86qw-open.desktop
            exec_line="$(sed -n 's/^Exec=//p' "$HOME/.local/share/applications/$handler" | head -1)"
            eval "${exec_line/\%u/--dry-run \"$LINK\"}" | grep -F -- "+qwurl $LINK"
            eval "${exec_line/\%u/--dry-run \"$demo\"}" | grep -F -- "+playdemo demos/x86qw-open-"
          fi
          # The handler copies the demo into qw/demos under its own name.
          for _ in $(seq 30); do
            ls "$target"/qw/demos/x86qw-open-*.mvd >/dev/null 2>&1 && break
            sleep 1
          done
          ls "$target"/qw/demos/x86qw-open-*.mvd
          pkill -f -i ezquake || true
          "$target/x86qw" uninstall --yes
          test ! -e "$target/x86qw"
          test ! -L "$HOME/.local/bin/x86qw"

  report:
    name: Report a failed night
    needs: e2e
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- x86qw-e2e-alert -->';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nThe nightly end-to-end install failed: ${runUrl}`;
            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'P1', per_page: 100 });
            const existing = open.find((issue) => !issue.pull_request && (issue.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'Nightly end-to-end install failed', labels: ['P1'], body });
            }
