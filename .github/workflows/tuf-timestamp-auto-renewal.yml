name: Renew public TUF timestamp

# The online timestamp key re-signs timestamp.json weekly with a 30-day lease,
# so the public chain always has more than three weeks of margin. Snapshot and
# targets stay offline-signed; the monitor warns 14 days before they expire.
# It runs unattended: the release environment has no reviewer, and a run that
# fails opens an issue.
on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Shared with the site deploy: one of them deploys at a time.
concurrency:
  group: x86qw-site-deploy
  cancel-in-progress: false

jobs:
  renew:
    name: Renew, deploy and record the timestamp
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          lfs: false
          fetch-depth: 1
          # The record step pushes with RELEASE_GH_TOKEN; a persisted
          # GITHUB_TOKEN header would override it and be denied.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build the release tooling
        working-directory: go
        run: go build -o "$RUNNER_TEMP/x86qw-release" ./cmd/x86qw-release
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install the pinned site toolchain
        working-directory: site
        run: npm ci
      - name: Refuse a checkout that diverges from production
        run: |
          set -euo pipefail
          curl -fsS --proto '=https' -H 'Cache-Control: no-cache' \
            "https://qw.x86.com.br/api/v1/trust/metadata/timestamp.json?renewal=${GITHUB_RUN_ID}" \
            -o "$RUNNER_TEMP/live-timestamp.json"
          cmp "$RUNNER_TEMP/live-timestamp.json" site/public/api/v1/trust/metadata/timestamp.json
      - name: Renew timestamp.json with the online key
        env:
          TUF_TIMESTAMP_KEY_B64: ${{ secrets.TUF_TIMESTAMP_KEY_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$TUF_TIMESTAMP_KEY_B64"
          printf '%s' "$TUF_TIMESTAMP_KEY_B64" | base64 --decode > "$RUNNER_TEMP/timestamp-key.pem"
          "$RUNNER_TEMP/x86qw-release" renew-timestamp \
            --current site/public/api/v1/trust/metadata/timestamp.json \
            --key "$RUNNER_TEMP/timestamp-key.pem" \
            --out "$RUNNER_TEMP/timestamp.json"
          rm -f "$RUNNER_TEMP/timestamp-key.pem"
          cp "$RUNNER_TEMP/timestamp.json" site/public/api/v1/trust/metadata/timestamp.json
      - name: Assemble and deploy the site generation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          "$RUNNER_TEMP/x86qw-release" site --source site/public --out "$RUNNER_TEMP/site/public" \
            --commit "$GITHUB_SHA" --deploy-run "$GITHUB_RUN_ID"
          cp site/wrangler.jsonc "$RUNNER_TEMP/site/wrangler.jsonc"
          site/node_modules/.bin/wrangler deploy \
            --config "$RUNNER_TEMP/site/wrangler.jsonc" \
            --assets "$RUNNER_TEMP/site/public" \
            --strict
      - name: Verify the public chain and the published timestamp
        run: |
          set -euo pipefail
          (cd go && "$RUNNER_TEMP/x86qw-release" monitor --warning-hours 72)
          curl -fsS --proto '=https' -H 'Cache-Control: no-cache' \
            "https://qw.x86.com.br/api/v1/trust/metadata/timestamp.json?confirm=${GITHUB_RUN_ID}" \
            -o "$RUNNER_TEMP/published.json"
          cmp "$RUNNER_TEMP/published.json" site/public/api/v1/trust/metadata/timestamp.json
      - name: Record the published timestamp on main
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          set -euo pipefail
          version="$(jq -r .signed.version site/public/api/v1/trust/metadata/timestamp.json)"
          branch="bot/tuf-timestamp-v${version}"
          git config user.name "x86qw-bot"
          git config user.email "x86qw-bot@users.noreply.github.com"
          git switch -c "$branch"
          git add site/public/api/v1/trust/metadata/timestamp.json
          git commit -m "chore(trust): record published TUF timestamp v${version}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          url="$(gh pr create --base main --head "$branch" \
            --title "chore(trust): record published TUF timestamp v${version}" \
            --body "Automatic weekly renewal. The timestamp is already live; this keeps the checked-out projection equal to production.")"
          # Auto-merge stalls under the signed-commit rule; a squash merge
          # through the API is signed by GitHub once the checks are green.
          number="${url##*/}"
          sleep 30
          gh pr checks "$url" --required --watch --interval 30
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${number}/merge" \
            -f merge_method=squash \
            -f commit_title="chore(trust): record published TUF timestamp v${version} (#${number})"
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
      - name: Open an issue when the renewal fails
        if: failure()
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner,
              repo,
              title: 'TUF timestamp renewal failed',
              labels: ['P0', 'owner-only'],
              body: [
                `The weekly timestamp renewal failed: ${runUrl}`,
                '',
                'If it refused because production diverges from main, deploy main with the "Deploy site" workflow and run the renewal again.',
                'The live timestamp keeps its current lease until then; `x86qw-release monitor` shows how long.',
              ].join('\n'),
            });
