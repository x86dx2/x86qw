name: Immutable candidate release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Rehearsal local ou promoção protegida de release"
        required: true
        default: rehearsal
        type: choice
        options:
          - rehearsal
          - promote-rc
          - promote-1.0
      release_audience:
        description: "Público da release: owner-only não exige gates de usuários externos"
        required: true
        default: owner-only
        type: choice
        options:
          - owner-only
          - external-public
      candidate_commit:
        description: "SHA completo do commit candidato"
        required: true
        type: string
      candidate_handoff:
        description: "JSON do candidato: run_id, artifact_id, artifact_name, candidate_sha256"
        required: false
        default: "{}"
        type: string
      candidate_version:
        description: "Versão SemVer do candidato (não altera VERSION público)"
        required: true
        default: "1.0.0"
        type: string
      release_title:
        description: "Título imutável da release e dos mirrors"
        required: true
        type: string
      release_notes:
        description: "Notas imutáveis da release e dos mirrors"
        required: true
        type: string
      native_evidence_handoff:
        description: "JSON da evidência M3: run_id, artifact_id, artifact_name"
        required: false
        default: "{}"
        type: string
      tuf_metadata_handoff:
        description: "JSON do handoff TUF: run_id, artifact_id, artifact_name, workflow"
        required: false
        default: "{}"
        type: string
      public_acceptance_handoff:
        description: "JSON da aceitação pública: commit, run_id, artifact_id, artifact_name, version, receipt_sha256, bundle_sha256, catalog_sha256"
        required: false
        default: "{}"
        type: string
      public_acceptance_scope:
        description: "Escopo comprovado pela aceitação: instalação limpa ou usuários externos"
        required: false
        default: single-user
        type: choice
        options:
          - single-user
          - external-users
      tuf_operation_handoff:
        description: "JSON do drill TUF: run_id, artifact_id, artifact_name, report_sha256, operator, custody_host, sla_hours"
        required: false
        default: "{}"
        type: string
      soak_handoff:
        description: "JSON do soak: commit, version, candidate_json_sha256, bundle_sha256, run_id, artifact_id, artifact_name, report_sha256, issue_number"
        required: false
        default: "{}"
        type: string

concurrency:
  group: x86qw-candidate-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  validate-release-inputs:
    name: Validate structured release handoffs
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          lfs: false
          fetch-depth: 1
      - name: Reject malformed or incomplete handoffs before build
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_AUDIENCE: ${{ inputs.release_audience }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          PUBLIC_ACCEPTANCE_SCOPE: ${{ inputs.public_acceptance_scope }}
          CANDIDATE_HANDOFF: ${{ inputs.candidate_handoff }}
          NATIVE_EVIDENCE_HANDOFF: ${{ inputs.native_evidence_handoff }}
          TUF_METADATA_HANDOFF: ${{ inputs.tuf_metadata_handoff }}
          PUBLIC_ACCEPTANCE_HANDOFF: ${{ inputs.public_acceptance_handoff }}
          TUF_OPERATION_HANDOFF: ${{ inputs.tuf_operation_handoff }}
          SOAK_HANDOFF: ${{ inputs.soak_handoff }}
        run: python3 maintenance/tools/validate_release_inputs.py

  build-once:
    name: Build once and bind candidate bytes
    needs: [validate, validate-release-inputs]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
      candidate-sha256: ${{ steps.identity.outputs.candidate-sha256 }}
      candidate-artifact-name: ${{ steps.identity.outputs.candidate-artifact-name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          lfs: false
          fetch-depth: 0
          fetch-tags: true
      - name: Checkout immutable candidate commit
        if: ${{ inputs.mode == 'rehearsal' }}
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          git fetch --no-tags origin "$CANDIDATE_COMMIT"
          git checkout --detach "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate prebuilt candidate provenance
        if: ${{ inputs.mode != 'rehearsal' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ fromJSON(inputs.candidate_handoff).run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ fromJSON(inputs.candidate_handoff).artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ fromJSON(inputs.candidate_handoff).artifact_name }}
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$CANDIDATE_ARTIFACT_NAME" =~ ^candidate-[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          python3 maintenance/tools/verify_external_handoff.py \
            --run-id "$CANDIDATE_RUN_ID" \
            --commit "$CANDIDATE_COMMIT" \
            --artifact "$CANDIDATE_ARTIFACT_NAME" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --workflow .github/workflows/release.yml \
            --output "$RUNNER_TEMP/candidate-artifact.json"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ inputs.mode == 'rehearsal' }}
        id: lfs-cache
        with:
          path: .git/lfs/objects
          key: x86qw-lfs-v3-${{ inputs.candidate_commit }}
          enableCrossOsArchive: true
      - name: Restore or fetch the LFS materialization
        if: ${{ inputs.mode == 'rehearsal' }}
        shell: bash
        run: |
          if [ "${{ steps.lfs-cache.outputs.cache-hit }}" = "true" ]; then
            git lfs checkout
          else
            python3 maintenance/tools/materialize_lfs.py \
              --repository "$GITHUB_REPOSITORY" \
              --commit "${{ inputs.candidate_commit }}"
            git lfs checkout
          fi
      - name: Validate immutable source identity and LFS
        if: ${{ inputs.mode == 'rehearsal' }}
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_MODE: ${{ inputs.mode }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
          case "$CANDIDATE_MODE" in
            promote-rc) [[ "$CANDIDATE_VERSION" =~ ^1\.0\.0-rc\.[0-9]+$ ]] ;;
            promote-1.0) test "$CANDIDATE_VERSION" = "1.0.0" ;;
          esac
          git lfs fsck --pointers
          python3 maintenance/tools/check_lfs.py
          ./maintenance/manage.py verify
      - name: Download immutable candidate artifact
        if: ${{ inputs.mode != 'rehearsal' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ fromJSON(inputs.candidate_handoff).artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(inputs.candidate_handoff).run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: release-work/candidate
      - name: Verify downloaded candidate identity
        if: ${{ inputs.mode != 'rehearsal' }}
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ fromJSON(inputs.candidate_handoff).candidate_sha256 }}
          EXPECTED_COMMIT: ${{ inputs.candidate_commit }}
          EXPECTED_VERSION: ${{ inputs.candidate_version }}
        run: |
          [[ "$EXPECTED_CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          actual="$(python3 -c 'import hashlib; print(hashlib.sha256(open("release-work/candidate/candidate.json", "rb").read()).hexdigest())')"
          test "$actual" = "$EXPECTED_CANDIDATE_SHA256"
          python3 maintenance/tools/release_candidate.py verify release-work/candidate
          python3 - "$EXPECTED_COMMIT" "$EXPECTED_VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path

          manifest = json.loads(Path("release-work/candidate/candidate.json").read_text(encoding="utf-8"))
          if manifest["commit"] != sys.argv[1] or manifest["version"] != sys.argv[2]:
              raise SystemExit("candidate.json diverge da identidade solicitada")
          PY
      - name: Build every candidate payload once
        if: ${{ inputs.mode == 'rehearsal' }}
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_MODE: ${{ inputs.mode }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          RELEASE_TITLE: ${{ inputs.release_title }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          CANDIDATE_GENERATED_AT="$(python -c 'import sys; from datetime import datetime, timezone; print(datetime.fromisoformat(sys.argv[1]).astimezone(timezone.utc).isoformat(timespec="seconds").replace("+00:00", "Z"))' "$(git show -s --format=%cI "$CANDIDATE_COMMIT")")"
          test -n "$CANDIDATE_GENERATED_AT"
          ./maintenance/manage.py build
          python3 maintenance/tools/build_installer_bundle.py \
            --output release-work/installer-build \
            --version "$CANDIDATE_VERSION" \
            --ownership-output release-work/ownership-installer.json
          mkdir -p release-work/input/content release-work/input/installer release-work/input/runtime release-work/input/site
          find maintenance/build/packages -type f -print0 | while IFS= read -r -d '' artifact; do
            relative="${artifact#maintenance/build/packages/}"
            destination="release-work/input/content/$relative"
            mkdir -p "$(dirname "$destination")"
            install -m644 "$artifact" "$destination"
          done
          for runtime_root in clients servers services; do
            find "dist/$runtime_root" -type f -print0 | while IFS= read -r -d '' artifact; do
              relative="${artifact#dist/$runtime_root/}"
              destination="release-work/input/runtime/$runtime_root/$relative"
              mkdir -p "$(dirname "$destination")"
              install -m644 "$artifact" "$destination"
            done
          done
          install -m644 \
            "release-work/installer-build/$CANDIDATE_VERSION/x86qw-installer-$CANDIDATE_VERSION.zip" \
            "release-work/input/installer/x86qw-installer-$CANDIDATE_VERSION.zip"
          mkdir -p release-work/input/runtime/native-smoke/macos-arm64
          install -m644 \
            maintenance/native_case_entrypoint.py \
            release-work/input/runtime/native-smoke/macos-arm64/x86qw-native-smoke
          mkdir -p release-work/input/runtime/native-smoke/macos-arm64/fixtures/migrations
          cp -R \
            maintenance/tests/fixtures/migrations/0.7.13 \
            release-work/input/runtime/native-smoke/macos-arm64/fixtures/migrations/0.7.13
          install -m644 \
            maintenance/native/macos-arm64/entrypoint.json \
            release-work/input/runtime/native-smoke/macos-arm64/entrypoint.json
          python3 maintenance/tools/build_release_catalog.py \
            --source site/public/api/v1/catalog.json \
            --installer "release-work/input/installer/x86qw-installer-$CANDIDATE_VERSION.zip" \
            --output release-work/input/catalog.json \
            --version "$CANDIDATE_VERSION" \
            --release-title "$RELEASE_TITLE" \
            --generated-at "$CANDIDATE_GENERATED_AT" \
            --release-notes "$RELEASE_NOTES" \
            --product-source site/public/api/v1/product.json \
            --product-output release-work/input/product.json
          python3 maintenance/tools/render_release_site.py \
            --source site/public \
            --catalog release-work/input/catalog.json \
            --product release-work/input/product.json \
            --bootstrap-source dist/installer/bin \
            --output release-work/input/site/public
          rm -rf release-work/input/site/public/api/v1/trust
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from maintenance.tools import release_ownership
          root = Path("release-work/input")
          artifacts = {}
          for path in sorted(root.rglob("*")):
              if path.is_file():
                  relative = path.relative_to(root).as_posix()
                  payload = path.read_bytes()
                  artifacts[relative] = {
                      "size": len(payload),
                      "sha256": hashlib.sha256(payload).hexdigest(),
                  }
          release_ownership.write_document(
              Path("release-work/ownership-all.json"),
              release_ownership.default_document(artifacts),
          )
          PY
          python3 maintenance/tools/release_candidate.py prepare \
            --source release-work/input \
            --output release-work/candidate \
            --version "$CANDIDATE_VERSION" \
            --commit "$CANDIDATE_COMMIT" \
            --generated-at "$CANDIDATE_GENERATED_AT" \
            --ownership-fragment release-work/ownership-all.json
          git diff --exit-code
      - name: Verify candidate before transport
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 maintenance/tools/release_candidate.py verify release-work/candidate
      - name: Record exact candidate identity
        id: identity
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_MODE: ${{ inputs.mode }}
          EXPECTED_CANDIDATE_SHA256: ${{ fromJSON(inputs.candidate_handoff).candidate_sha256 }}
        run: |
          digest="$(python3 -c 'import hashlib; print(hashlib.sha256(open("release-work/candidate/candidate.json", "rb").read()).hexdigest())')"
          if [ "$CANDIDATE_MODE" != "rehearsal" ]; then
            [[ "$EXPECTED_CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            test "$digest" = "$EXPECTED_CANDIDATE_SHA256"
          fi
          echo "candidate-sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "candidate-artifact-name=candidate-${CANDIDATE_COMMIT}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload without overwrite
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-work/candidate
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  portable-verify:
    name: Verify exact candidate / ${{ matrix.os }}
    needs: build-once
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          lfs: false
          fetch-depth: 1
      - name: Checkout immutable candidate commit
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          git fetch --no-tags origin "$CANDIDATE_COMMIT"
          git checkout --detach "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Download by immutable artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build-once.outputs.artifact-id }}
          merge-multiple: true
          path: downloaded-candidate
      - name: Verify downloaded bytes without rebuild
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          EXPECTED_CANDIDATE_SHA256: ${{ needs.build-once.outputs.candidate-sha256 }}
        run: |
          actual="$(python -c 'import hashlib; print(hashlib.sha256(open("downloaded-candidate/candidate.json", "rb").read()).hexdigest())')"
          test "$actual" = "$EXPECTED_CANDIDATE_SHA256"
          python maintenance/tools/release_candidate.py verify downloaded-candidate

  approval-preview:
    name: Evidence-free rehearsal only
    if: ${{ inputs.mode == 'rehearsal' }}
    needs: [build-once, portable-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          lfs: false
          fetch-depth: 1
      - name: Checkout immutable candidate commit
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          git fetch --no-tags origin "$CANDIDATE_COMMIT"
          git checkout --detach "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build-once.outputs.artifact-id }}
          merge-multiple: true
          path: candidate
      # release_evidence_binding.py remains available for private raw-handoff
      # audits; the legacy --artifact-root m3-evidence contract is intentionally
      # not executed here because this rehearsal makes no M3 claim.
      - name: Rehearse immutable copy without M3 claim
        run: python3 maintenance/tools/release_candidate.py rehearse candidate "$RUNNER_TEMP/x86qw-rehearsal"

  approval:
    name: Protected release approval boundary
    if: ${{ inputs.mode != 'rehearsal' }}
    needs: [build-once, portable-verify]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - name: Show exact approval identity
        run: |
          echo "version=${{ inputs.candidate_version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "commit=${{ inputs.candidate_commit }}" >> "$GITHUB_STEP_SUMMARY"
          echo "candidate=${{ needs.build-once.outputs.candidate-sha256 }}" >> "$GITHUB_STEP_SUMMARY"
          echo "transport=${{ needs.build-once.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "M3 evidence is mandatory; this PR does not manufacture it." >> "$GITHUB_STEP_SUMMARY"

  release-blockers:
    name: Recheck live P0/P1 blockers
    if: ${{ inputs.mode != 'rehearsal' }}
    needs: [approval]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          lfs: false
          fetch-depth: 1
      - name: Checkout immutable candidate commit
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          git fetch --no-tags origin "$CANDIDATE_COMMIT"
          git checkout --detach "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Fail closed on open P0/P1 issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 maintenance/tools/check_release_blockers.py --repo "$GITHUB_REPOSITORY"

  verify-public-acceptance:
    name: Require public RC acceptance before 1.0.0
    if: ${{ inputs.mode == 'promote-1.0' }}
    needs: [approval, release-blockers]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate public acceptance coordinates
        env:
          ACCEPTANCE_COMMIT: ${{ fromJSON(inputs.public_acceptance_handoff).commit }}
          ACCEPTANCE_RUN_ID: ${{ fromJSON(inputs.public_acceptance_handoff).run_id }}
          ACCEPTANCE_ARTIFACT_ID: ${{ fromJSON(inputs.public_acceptance_handoff).artifact_id }}
          ACCEPTANCE_ARTIFACT_NAME: ${{ fromJSON(inputs.public_acceptance_handoff).artifact_name }}
          ACCEPTANCE_VERSION: ${{ fromJSON(inputs.public_acceptance_handoff).version }}
          ACCEPTANCE_RECEIPT_SHA256: ${{ fromJSON(inputs.public_acceptance_handoff).receipt_sha256 }}
          ACCEPTANCE_BUNDLE_SHA256: ${{ fromJSON(inputs.public_acceptance_handoff).bundle_sha256 }}
          ACCEPTANCE_CATALOG_SHA256: ${{ fromJSON(inputs.public_acceptance_handoff).catalog_sha256 }}
          ACCEPTANCE_SCOPE: ${{ inputs.public_acceptance_scope }}
          RELEASE_AUDIENCE: ${{ inputs.release_audience }}
        run: |
          [[ "$ACCEPTANCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACCEPTANCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$ACCEPTANCE_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$ACCEPTANCE_ARTIFACT_NAME" =~ ^public-acceptance-[A-Za-z0-9._-]{1,180}$ ]]
          [[ "$ACCEPTANCE_VERSION" =~ ^1\.0\.0-rc\.[0-9]+$ ]]
          [[ "$ACCEPTANCE_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ACCEPTANCE_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ACCEPTANCE_CATALOG_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$ACCEPTANCE_SCOPE" == "single-user" || "$ACCEPTANCE_SCOPE" == "external-users" ]]
          if [ "$RELEASE_AUDIENCE" = "owner-only" ]; then
            test "$ACCEPTANCE_SCOPE" = "single-user"
          else
            test "$RELEASE_AUDIENCE" = "external-public"
            test "$ACCEPTANCE_SCOPE" = "external-users"
          fi
      - name: Verify the protected acceptance run provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ACCEPTANCE_COMMIT: ${{ fromJSON(inputs.public_acceptance_handoff).commit }}
          ACCEPTANCE_RUN_ID: ${{ fromJSON(inputs.public_acceptance_handoff).run_id }}
          ACCEPTANCE_ARTIFACT_ID: ${{ fromJSON(inputs.public_acceptance_handoff).artifact_id }}
          ACCEPTANCE_ARTIFACT_NAME: ${{ fromJSON(inputs.public_acceptance_handoff).artifact_name }}
        run: |
          python3 maintenance/tools/verify_external_handoff.py \
            --run-id "$ACCEPTANCE_RUN_ID" \
            --commit "$ACCEPTANCE_COMMIT" \
            --artifact "$ACCEPTANCE_ARTIFACT_NAME" \
            --artifact-id "$ACCEPTANCE_ARTIFACT_ID" \
            --workflow .github/workflows/public-acceptance.yml \
            --head-branch main \
            --output "$RUNNER_TEMP/public-acceptance-artifact.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ fromJSON(inputs.public_acceptance_handoff).artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(inputs.public_acceptance_handoff).run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: public-acceptance
      - name: Verify the public acceptance contract and exact RC version
        env:
          ACCEPTANCE_VERSION: ${{ fromJSON(inputs.public_acceptance_handoff).version }}
          ACCEPTANCE_RECEIPT_SHA256: ${{ fromJSON(inputs.public_acceptance_handoff).receipt_sha256 }}
          ACCEPTANCE_BUNDLE_SHA256: ${{ fromJSON(inputs.public_acceptance_handoff).bundle_sha256 }}
          ACCEPTANCE_CATALOG_SHA256: ${{ fromJSON(inputs.public_acceptance_handoff).catalog_sha256 }}
          ACCEPTANCE_SCOPE: ${{ inputs.public_acceptance_scope }}
        run: |
          test -f public-acceptance/public-acceptance.json
          python3 maintenance/tools/verify_public_acceptance.py \
            --record public-acceptance/public-acceptance.json \
            --version "$ACCEPTANCE_VERSION" \
            --expected-receipt-sha256 "$ACCEPTANCE_RECEIPT_SHA256" \
            --expected-bundle-sha256 "$ACCEPTANCE_BUNDLE_SHA256" \
            --expected-catalog-sha256 "$ACCEPTANCE_CATALOG_SHA256" \
            --expected-scope "$ACCEPTANCE_SCOPE"
          echo "public RC acceptance verified for $ACCEPTANCE_VERSION" >> "$GITHUB_STEP_SUMMARY"

  verify-soak:
    name: Require a completed protected RC soak before 1.0.0
    if: ${{ inputs.mode == 'promote-1.0' && inputs.release_audience == 'external-public' }}
    needs: [approval, release-blockers, verify-public-acceptance]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      actions: read
      issues: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate protected soak coordinates
        env:
          SOAK_COMMIT: ${{ fromJSON(inputs.soak_handoff).commit }}
          SOAK_VERSION: ${{ fromJSON(inputs.soak_handoff).version }}
          SOAK_CANDIDATE_JSON_SHA256: ${{ fromJSON(inputs.soak_handoff).candidate_json_sha256 }}
          SOAK_BUNDLE_SHA256: ${{ fromJSON(inputs.soak_handoff).bundle_sha256 }}
          SOAK_RUN_ID: ${{ fromJSON(inputs.soak_handoff).run_id }}
          SOAK_ARTIFACT_ID: ${{ fromJSON(inputs.soak_handoff).artifact_id }}
          SOAK_ARTIFACT_NAME: ${{ fromJSON(inputs.soak_handoff).artifact_name }}
          SOAK_REPORT_SHA256: ${{ fromJSON(inputs.soak_handoff).report_sha256 }}
          SOAK_ISSUE_NUMBER: ${{ fromJSON(inputs.soak_handoff).issue_number }}
          ACCEPTANCE_VERSION: ${{ fromJSON(inputs.public_acceptance_handoff).version }}
          ACCEPTANCE_BUNDLE_SHA256: ${{ fromJSON(inputs.public_acceptance_handoff).bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SOAK_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOAK_VERSION" =~ ^1\.0\.0-rc\.[0-9]+$ ]]
          [[ "$SOAK_CANDIDATE_JSON_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOAK_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOAK_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SOAK_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SOAK_ARTIFACT_NAME" =~ ^rc-soak-[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$SOAK_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOAK_ISSUE_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]]
          test "$SOAK_VERSION" = "$ACCEPTANCE_VERSION"
          test "$SOAK_BUNDLE_SHA256" = "$ACCEPTANCE_BUNDLE_SHA256"
      - name: Verify completed soak run provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOAK_COMMIT: ${{ fromJSON(inputs.soak_handoff).commit }}
          SOAK_RUN_ID: ${{ fromJSON(inputs.soak_handoff).run_id }}
          SOAK_ARTIFACT_ID: ${{ fromJSON(inputs.soak_handoff).artifact_id }}
          SOAK_ARTIFACT_NAME: ${{ fromJSON(inputs.soak_handoff).artifact_name }}
        run: |
          python3 maintenance/tools/verify_external_handoff.py \
            --run-id "$SOAK_RUN_ID" \
            --commit "$SOAK_COMMIT" \
            --artifact "$SOAK_ARTIFACT_NAME" \
            --artifact-id "$SOAK_ARTIFACT_ID" \
            --workflow .github/workflows/rc-soak.yml \
            --output "$RUNNER_TEMP/soak-artifact.json"
      - name: Download the exact immutable soak report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ fromJSON(inputs.soak_handoff).artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(inputs.soak_handoff).run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: soak-report
      - name: Verify the completed soak report and exact RC identity
        env:
          SOAK_COMMIT: ${{ fromJSON(inputs.soak_handoff).commit }}
          SOAK_VERSION: ${{ fromJSON(inputs.soak_handoff).version }}
          SOAK_CANDIDATE_JSON_SHA256: ${{ fromJSON(inputs.soak_handoff).candidate_json_sha256 }}
          SOAK_BUNDLE_SHA256: ${{ fromJSON(inputs.soak_handoff).bundle_sha256 }}
          SOAK_REPORT_SHA256: ${{ fromJSON(inputs.soak_handoff).report_sha256 }}
          SOAK_ISSUE_NUMBER: ${{ fromJSON(inputs.soak_handoff).issue_number }}
        run: |
          set -euo pipefail
          test -f soak-report/report.json
          actual="$(python3 -c 'import hashlib; print(hashlib.sha256(open("soak-report/report.json", "rb").read()).hexdigest())')"
          test "$actual" = "$SOAK_REPORT_SHA256"
          python3 maintenance/tools/verify_soak_report.py \
            --report soak-report/report.json \
            --expected-commit "$SOAK_COMMIT" \
            --expected-version "$SOAK_VERSION" \
            --expected-candidate-json-sha256 "$SOAK_CANDIDATE_JSON_SHA256" \
            --expected-bundle-sha256 "$SOAK_BUNDLE_SHA256" \
            --expected-issue-number "$SOAK_ISSUE_NUMBER" \
            --minimum-days 7
          echo "completed protected RC soak verified for $SOAK_VERSION" >> "$GITHUB_STEP_SUMMARY"

  verify-public-tuf:
    name: Require a healthy live public TUF lease before 1.0.0
    if: ${{ inputs.mode == 'promote-1.0' && inputs.release_audience == 'external-public' }}
    needs: [approval, release-blockers, verify-public-acceptance, verify-soak]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned trust dependencies from vendored wheels
        run: python -m pip install --no-index --find-links maintenance/vendor/wheels --require-hashes -r maintenance/requirements-trust.txt
      - name: Authenticate the live public TUF chain and lease
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 maintenance/tools/monitor_public_tuf.py \
            --root maintenance/trust/root.json \
            --warning-hours 6
          echo "live public TUF lease is outside the warning window" >> "$GITHUB_STEP_SUMMARY"

  attach-native-evidence:
    name: Attach authorized M3 evidence without rebuild
    if: ${{ always() && inputs.mode != 'rehearsal' && needs.build-once.result == 'success' && needs.portable-verify.result == 'success' && needs.approval.result == 'success' && needs.release-blockers.result == 'success' && (needs.verify-public-acceptance.result == 'success' || needs.verify-public-acceptance.result == 'skipped') && (needs.verify-soak.result == 'success' || needs.verify-soak.result == 'skipped') && (needs.verify-public-tuf.result == 'success' || needs.verify-public-tuf.result == 'skipped') }}
    needs: [build-once, portable-verify, approval, release-blockers, verify-public-acceptance, verify-soak, verify-public-tuf]
    # The signed artifact comes from .github/workflows/sign-native-evidence.yml;
    # its .github/workflows/native-m3.yml input was verified against the
    # native run. Under ADR 0007 the signer may be the sole maintainer; the
    # workflow does not claim independent human review.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          lfs: false
          fetch-depth: 1
      - name: Checkout immutable candidate commit
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          git fetch --no-tags origin "$CANDIDATE_COMMIT"
          git checkout --detach "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned trust dependencies from vendored wheels
        run: python -m pip install --no-index --find-links maintenance/vendor/wheels --require-hashes -r maintenance/requirements-trust.txt
      - name: Validate final TUF operation handoff coordinates
        if: ${{ inputs.mode == 'promote-1.0' && inputs.release_audience == 'external-public' }}
        env:
          TUF_OPERATION_RUN_ID: ${{ fromJSON(inputs.tuf_operation_handoff).run_id }}
          TUF_OPERATION_ARTIFACT_ID: ${{ fromJSON(inputs.tuf_operation_handoff).artifact_id }}
          TUF_OPERATION_ARTIFACT_NAME: ${{ fromJSON(inputs.tuf_operation_handoff).artifact_name }}
          TUF_OPERATION_REPORT_SHA256: ${{ fromJSON(inputs.tuf_operation_handoff).report_sha256 }}
          TUF_OPERATION_OPERATOR: ${{ fromJSON(inputs.tuf_operation_handoff).operator }}
          TUF_OPERATION_CUSTODY_HOST: ${{ fromJSON(inputs.tuf_operation_handoff).custody_host }}
          TUF_OPERATION_SLA_HOURS: ${{ fromJSON(inputs.tuf_operation_handoff).sla_hours }}
        run: |
          set -euo pipefail
          [[ "$TUF_OPERATION_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$TUF_OPERATION_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$TUF_OPERATION_ARTIFACT_NAME" =~ ^tuf-operation-[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$TUF_OPERATION_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TUF_OPERATION_OPERATOR" =~ ^[^[:cntrl:][:space:]][^[:cntrl:]]{0,126}[^[:cntrl:][:space:]]$|^[^[:cntrl:][:space:]]$ ]]
          [[ "$TUF_OPERATION_CUSTODY_HOST" =~ ^[^[:cntrl:][:space:]][^[:cntrl:]]{0,126}[^[:cntrl:][:space:]]$|^[^[:cntrl:][:space:]]$ ]]
          [[ "$TUF_OPERATION_SLA_HOURS" =~ ^[1-9][0-9]{0,3}$ ]]
          test "$TUF_OPERATION_SLA_HOURS" -le 8760
      - name: Verify final TUF operation handoff provenance
        if: ${{ inputs.mode == 'promote-1.0' && inputs.release_audience == 'external-public' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          TUF_OPERATION_RUN_ID: ${{ fromJSON(inputs.tuf_operation_handoff).run_id }}
          TUF_OPERATION_ARTIFACT_ID: ${{ fromJSON(inputs.tuf_operation_handoff).artifact_id }}
          TUF_OPERATION_ARTIFACT_NAME: ${{ fromJSON(inputs.tuf_operation_handoff).artifact_name }}
        run: |
          python3 maintenance/tools/verify_external_handoff.py \
            --run-id "$TUF_OPERATION_RUN_ID" \
            --commit "$CANDIDATE_COMMIT" \
            --artifact "$TUF_OPERATION_ARTIFACT_NAME" \
            --artifact-id "$TUF_OPERATION_ARTIFACT_ID" \
            --workflow .github/workflows/tuf-operation-drill.yml \
            --output "$RUNNER_TEMP/tuf-operation-artifact.json"
      - name: Validate external handoff coordinates
        env:
          EVIDENCE_RUN_ID: ${{ fromJSON(inputs.native_evidence_handoff).run_id }}
          EVIDENCE_ARTIFACT_ID: ${{ fromJSON(inputs.native_evidence_handoff).artifact_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ fromJSON(inputs.native_evidence_handoff).artifact_name }}
        run: |
          [[ "$EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$EVIDENCE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$EVIDENCE_ARTIFACT_NAME" =~ ^native-m3-signed-[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
      - name: Verify signed evidence handoff provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          EVIDENCE_RUN_ID: ${{ fromJSON(inputs.native_evidence_handoff).run_id }}
          EVIDENCE_ARTIFACT_ID: ${{ fromJSON(inputs.native_evidence_handoff).artifact_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ fromJSON(inputs.native_evidence_handoff).artifact_name }}
        run: |
          python3 maintenance/tools/verify_external_handoff.py \
            --run-id "$EVIDENCE_RUN_ID" \
            --commit "$CANDIDATE_COMMIT" \
            --artifact "$EVIDENCE_ARTIFACT_NAME" \
            --artifact-id "$EVIDENCE_ARTIFACT_ID" \
            --workflow .github/workflows/sign-native-evidence.yml \
            --output "$RUNNER_TEMP/native-evidence-artifact.json"
      - name: Download exact candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build-once.outputs.artifact-id }}
          merge-multiple: true
          path: downloaded-candidate
      - name: Download final TUF operation report
        if: ${{ inputs.mode == 'promote-1.0' && inputs.release_audience == 'external-public' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ fromJSON(inputs.tuf_operation_handoff).artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(inputs.tuf_operation_handoff).run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: tuf-operation
      - name: Verify final TUF operation report against candidate
        if: ${{ inputs.mode == 'promote-1.0' && inputs.release_audience == 'external-public' }}
        env:
          TUF_OPERATION_REPORT_SHA256: ${{ fromJSON(inputs.tuf_operation_handoff).report_sha256 }}
          TUF_OPERATION_OPERATOR: ${{ fromJSON(inputs.tuf_operation_handoff).operator }}
          TUF_OPERATION_CUSTODY_HOST: ${{ fromJSON(inputs.tuf_operation_handoff).custody_host }}
          TUF_OPERATION_SLA_HOURS: ${{ fromJSON(inputs.tuf_operation_handoff).sla_hours }}
        run: |
          set -euo pipefail
          test -f tuf-operation/report.json
          actual="$(python3 -c 'import hashlib; print(hashlib.sha256(open("tuf-operation/report.json", "rb").read()).hexdigest())')"
          test "$actual" = "$TUF_OPERATION_REPORT_SHA256"
          python3 maintenance/tools/verify_tuf_operation_report.py \
            --candidate downloaded-candidate \
            --report tuf-operation/report.json \
            > "$RUNNER_TEMP/tuf-operation-report.json"
          TUF_OPERATION_OPERATOR="$TUF_OPERATION_OPERATOR" \
          TUF_OPERATION_CUSTODY_HOST="$TUF_OPERATION_CUSTODY_HOST" \
          TUF_OPERATION_SLA_HOURS="$TUF_OPERATION_SLA_HOURS" \
          python3 - "$RUNNER_TEMP/tuf-operation-report.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          operation = report["operation"]
          expected = {
              "operator": os.environ["TUF_OPERATION_OPERATOR"],
              "custody_host": os.environ["TUF_OPERATION_CUSTODY_HOST"],
              "timestamp_sla_hours": int(os.environ["TUF_OPERATION_SLA_HOURS"]),
          }
          actual = {key: operation[key] for key in expected}
          if actual != expected:
              raise SystemExit("contexto operacional do relatório diverge dos inputs protegidos")
          PY
      - name: Download authorized signed M3 handoff
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ fromJSON(inputs.native_evidence_handoff).artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(inputs.native_evidence_handoff).run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: external-evidence
      - name: Attach evidence and reverify candidate bytes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 maintenance/tools/attach_release_evidence.py \
            --candidate downloaded-candidate \
            --evidence external-evidence \
            --output candidate-with-m3
          python3 maintenance/tools/release_candidate.py verify candidate-with-m3
      - name: Create durable evidence root and release receipt
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          CANDIDATE_RUN_ID: ${{ fromJSON(inputs.candidate_handoff).run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ fromJSON(inputs.candidate_handoff).artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ fromJSON(inputs.candidate_handoff).artifact_name }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ needs.build-once.outputs.artifact-digest }}
          EVIDENCE_RUN_ID: ${{ fromJSON(inputs.native_evidence_handoff).run_id }}
          EVIDENCE_ARTIFACT_ID: ${{ fromJSON(inputs.native_evidence_handoff).artifact_id }}
          EVIDENCE_ARTIFACT_NAME: ${{ fromJSON(inputs.native_evidence_handoff).artifact_name }}
          TUF_RUN_ID: ${{ fromJSON(inputs.tuf_metadata_handoff).run_id }}
          TUF_ARTIFACT_ID: ${{ fromJSON(inputs.tuf_metadata_handoff).artifact_id }}
          TUF_ARTIFACT_NAME: ${{ fromJSON(inputs.tuf_metadata_handoff).artifact_name }}
          TUF_WORKFLOW: ${{ fromJSON(inputs.tuf_metadata_handoff).workflow }}
          RELEASE_AUDIENCE: ${{ inputs.release_audience }}
          ACCEPTANCE_REQUIRED: ${{ inputs.mode == 'promote-1.0' }}
          ACCEPTANCE_COMMIT: ${{ fromJSON(inputs.public_acceptance_handoff).commit }}
          ACCEPTANCE_RUN_ID: ${{ fromJSON(inputs.public_acceptance_handoff).run_id }}
          ACCEPTANCE_ARTIFACT_ID: ${{ fromJSON(inputs.public_acceptance_handoff).artifact_id }}
          ACCEPTANCE_ARTIFACT_NAME: ${{ fromJSON(inputs.public_acceptance_handoff).artifact_name }}
          ACCEPTANCE_VERSION: ${{ fromJSON(inputs.public_acceptance_handoff).version }}
          ACCEPTANCE_RECEIPT_SHA256: ${{ fromJSON(inputs.public_acceptance_handoff).receipt_sha256 }}
          ACCEPTANCE_BUNDLE_SHA256: ${{ fromJSON(inputs.public_acceptance_handoff).bundle_sha256 }}
          ACCEPTANCE_CATALOG_SHA256: ${{ fromJSON(inputs.public_acceptance_handoff).catalog_sha256 }}
          TUF_OPERATION_REQUIRED: ${{ inputs.mode == 'promote-1.0' && inputs.release_audience == 'external-public' }}
          TUF_OPERATION_RUN_ID: ${{ fromJSON(inputs.tuf_operation_handoff).run_id }}
          TUF_OPERATION_ARTIFACT_ID: ${{ fromJSON(inputs.tuf_operation_handoff).artifact_id }}
          TUF_OPERATION_ARTIFACT_NAME: ${{ fromJSON(inputs.tuf_operation_handoff).artifact_name }}
          TUF_OPERATION_REPORT_SHA256: ${{ fromJSON(inputs.tuf_operation_handoff).report_sha256 }}
          TUF_OPERATION_OPERATOR: ${{ fromJSON(inputs.tuf_operation_handoff).operator }}
          TUF_OPERATION_CUSTODY_HOST: ${{ fromJSON(inputs.tuf_operation_handoff).custody_host }}
          TUF_OPERATION_SLA_HOURS: ${{ fromJSON(inputs.tuf_operation_handoff).sla_hours }}
          SOAK_REQUIRED: ${{ inputs.mode == 'promote-1.0' && inputs.release_audience == 'external-public' }}
          SOAK_COMMIT: ${{ fromJSON(inputs.soak_handoff).commit }}
          SOAK_VERSION: ${{ fromJSON(inputs.soak_handoff).version }}
          SOAK_CANDIDATE_JSON_SHA256: ${{ fromJSON(inputs.soak_handoff).candidate_json_sha256 }}
          SOAK_BUNDLE_SHA256: ${{ fromJSON(inputs.soak_handoff).bundle_sha256 }}
          SOAK_RUN_ID: ${{ fromJSON(inputs.soak_handoff).run_id }}
          SOAK_ARTIFACT_ID: ${{ fromJSON(inputs.soak_handoff).artifact_id }}
          SOAK_ARTIFACT_NAME: ${{ fromJSON(inputs.soak_handoff).artifact_name }}
          SOAK_REPORT_SHA256: ${{ fromJSON(inputs.soak_handoff).report_sha256 }}
          SOAK_ISSUE_NUMBER: ${{ fromJSON(inputs.soak_handoff).issue_number }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - "$RUNNER_TEMP/release-receipt-coordinates.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          from urllib.parse import quote

          version = os.environ["CANDIDATE_VERSION"]
          tag = f"x86qw-installer-{version}"
          filename = f"x86qw-installer-{version}.zip"
          coordinates = {
              "release_audience": os.environ["RELEASE_AUDIENCE"],
              "promotion": {
                  "workflow": ".github/workflows/release.yml",
                  "run_id": os.environ["RELEASE_RUN_ID"],
                  "run_attempt": os.environ["RELEASE_RUN_ATTEMPT"],
                  "candidate_run_id": os.environ["CANDIDATE_RUN_ID"],
                  "candidate_artifact_id": os.environ["CANDIDATE_ARTIFACT_ID"],
                  "candidate_artifact_name": os.environ["CANDIDATE_ARTIFACT_NAME"],
                  "candidate_artifact_digest": os.environ["CANDIDATE_ARTIFACT_DIGEST"],
                  "native_evidence_run_id": os.environ["EVIDENCE_RUN_ID"],
                  "native_evidence_artifact_id": os.environ["EVIDENCE_ARTIFACT_ID"],
                  "native_evidence_artifact_name": os.environ["EVIDENCE_ARTIFACT_NAME"],
              },
              "publication": {
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "tag": tag,
                  "github_release": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/tag/{tag}",
                  "gitlab_project": "x86dx2/x86qw",
                  "gitlab_asset": (
                      "https://gitlab.com/api/v4/projects/84813414/packages/generic/"
                      f"x86qw-installer/{quote(version, safe='')}/{quote(filename, safe='')}"
                  ),
              },
              "tuf": {
                  "workflow": os.environ["TUF_WORKFLOW"],
                  "run_id": os.environ["TUF_RUN_ID"],
                  "artifact_id": os.environ["TUF_ARTIFACT_ID"],
                  "artifact_name": os.environ["TUF_ARTIFACT_NAME"],
              },
              "deployment": {
                  "endpoint": "https://x86qw.x86.com.br",
                  "verification": "tuf,bootstraps,product,public-install",
              },
          }
          if os.environ["ACCEPTANCE_REQUIRED"].lower() == "true":
              coordinates["public_acceptance"] = {
                  "commit": os.environ["ACCEPTANCE_COMMIT"],
                  "run_id": os.environ["ACCEPTANCE_RUN_ID"],
                  "artifact_id": os.environ["ACCEPTANCE_ARTIFACT_ID"],
                  "artifact_name": os.environ["ACCEPTANCE_ARTIFACT_NAME"],
                  "version": os.environ["ACCEPTANCE_VERSION"],
                  "receipt_sha256": os.environ["ACCEPTANCE_RECEIPT_SHA256"],
                  "bundle_sha256": os.environ["ACCEPTANCE_BUNDLE_SHA256"],
                  "catalog_sha256": os.environ["ACCEPTANCE_CATALOG_SHA256"],
              }
          if os.environ["SOAK_REQUIRED"].lower() == "true":
              coordinates["soak"] = {
                  "workflow": ".github/workflows/rc-soak.yml",
                  "run_id": os.environ["SOAK_RUN_ID"],
                  "artifact_id": os.environ["SOAK_ARTIFACT_ID"],
                  "artifact_name": os.environ["SOAK_ARTIFACT_NAME"],
                  "report_sha256": os.environ["SOAK_REPORT_SHA256"],
                  "commit": os.environ["SOAK_COMMIT"],
                  "version": os.environ["SOAK_VERSION"],
                  "candidate_json_sha256": os.environ["SOAK_CANDIDATE_JSON_SHA256"],
                  "bundle_sha256": os.environ["SOAK_BUNDLE_SHA256"],
                  "issue_number": os.environ["SOAK_ISSUE_NUMBER"],
                  "minimum_days": "7",
              }
          if os.environ["TUF_OPERATION_REQUIRED"].lower() == "true":
              coordinates["tuf_operation"] = {
                  "workflow": ".github/workflows/tuf-operation-drill.yml",
                  "run_id": os.environ["TUF_OPERATION_RUN_ID"],
                  "artifact_id": os.environ["TUF_OPERATION_ARTIFACT_ID"],
                  "artifact_name": os.environ["TUF_OPERATION_ARTIFACT_NAME"],
                  "report_sha256": os.environ["TUF_OPERATION_REPORT_SHA256"],
                  "operator": os.environ["TUF_OPERATION_OPERATOR"],
                  "custody_host": os.environ["TUF_OPERATION_CUSTODY_HOST"],
                  "timestamp_sla_hours": os.environ["TUF_OPERATION_SLA_HOURS"],
              }
          Path(sys.argv[1]).write_text(json.dumps(coordinates, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python3 maintenance/tools/release_receipt.py write \
            --candidate candidate-with-m3 \
            --evidence-root maintenance/trust/m3-root.json \
            --coordinates "$RUNNER_TEMP/release-receipt-coordinates.json"
          python3 maintenance/tools/release_receipt.py verify \
            --candidate candidate-with-m3 \
            --trust-root maintenance/trust/m3-root.json
      - name: Upload evidence-bound candidate without overwrite
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-with-m3-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate-with-m3
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  promotion-gate:
    name: Fail closed without canonical M3 evidence
    if: ${{ always() && inputs.mode != 'rehearsal' && needs.build-once.result == 'success' && needs.portable-verify.result == 'success' && needs.approval.result == 'success' && needs.release-blockers.result == 'success' && needs.attach-native-evidence.result == 'success' && (needs.verify-public-acceptance.result == 'success' || needs.verify-public-acceptance.result == 'skipped') && (needs.verify-soak.result == 'success' || needs.verify-soak.result == 'skipped') && (needs.verify-public-tuf.result == 'success' || needs.verify-public-tuf.result == 'skipped') }}
    needs: [build-once, portable-verify, approval, release-blockers, attach-native-evidence, verify-public-acceptance, verify-soak, verify-public-tuf]
    outputs:
      promoted-artifact-id: ${{ steps.upload.outputs.artifact-id }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          lfs: false
          fetch-depth: 1
      - name: Checkout immutable candidate commit
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
        run: |
          git fetch --no-tags origin "$CANDIDATE_COMMIT"
          git checkout --detach "$CANDIDATE_COMMIT"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned trust dependencies from vendored wheels
        run: python -m pip install --no-index --find-links maintenance/vendor/wheels --require-hashes -r maintenance/requirements-trust.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.attach-native-evidence.outputs.artifact-id }}
          merge-multiple: true
          path: candidate
      - name: Require final candidate bytes differ from soaked RC
        if: ${{ inputs.mode == 'promote-1.0' && inputs.release_audience == 'external-public' }}
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          SOAK_CANDIDATE_JSON_SHA256: ${{ fromJSON(inputs.soak_handoff).candidate_json_sha256 }}
          SOAK_BUNDLE_SHA256: ${{ fromJSON(inputs.soak_handoff).bundle_sha256 }}
        run: |
          set -euo pipefail
          [[ "$SOAK_CANDIDATE_JSON_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOAK_BUNDLE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          actual_candidate="$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' candidate/candidate.json)"
          test "$actual_candidate" != "$SOAK_CANDIDATE_JSON_SHA256"
          bundle="candidate/installer/x86qw-installer-$CANDIDATE_VERSION.zip"
          test -f "$bundle"
          actual_bundle="$(python3 -c 'import hashlib,sys; print(hashlib.sha256(open(sys.argv[1], "rb").read()).hexdigest())' "$bundle")"
          test "$actual_bundle" != "$SOAK_BUNDLE_SHA256"
          {
            echo "final candidate.json differs from the soaked RC"
            echo "final installer differs from the soaked RC"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Require PR G M3 evidence before any mirror or metadata operation
        env:
          M3_TRUST_ROOT_B64: ${{ secrets.M3_TRUST_ROOT_B64 }}
        run: |
          test -n "$M3_TRUST_ROOT_B64" || {
            echo "M3_TRUST_ROOT_B64 não está configurada no ambiente protegido release" >&2
            exit 1
          }
          root="$RUNNER_TEMP/m3-root.json"
          umask 077
          printf '%s' "$M3_TRUST_ROOT_B64" | base64 --decode > "$root"
          test -s "$root"
          versioned_root_b64="$(python3 -c 'import base64; print(base64.b64encode(open("maintenance/trust/m3-root.json", "rb").read()).decode("ascii"))')"
          test "$M3_TRUST_ROOT_B64" = "$versioned_root_b64" || {
            echo "M3 root secret diverges from the versioned public root" >&2
            exit 1
          }
          test -f candidate/release-evidence.json || {
            echo "M3 release-evidence.json is absent; promotion remains fail-closed" >&2
            exit 1
          }
          test -f candidate/evidence-root.json || {
            echo "evidence-root.json ausente; promoção permanece fail-closed" >&2
            exit 1
          }
          test -f candidate/release-receipt.json || {
            echo "release-receipt.json ausente; promoção permanece fail-closed" >&2
            exit 1
          }
          python3 maintenance/tools/release_receipt.py verify \
            --candidate candidate \
            --trust-root "$root"
          python3 maintenance/tools/release_candidate.py promote \
            candidate promoted --trust-root "$root"
      - name: Upload promoted bytes without overwrite
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promoted-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: promoted
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 90

  publish-assets:
    name: Publish exact candidate assets to GitHub
    if: ${{ always() && (inputs.mode == 'promote-rc' || inputs.mode == 'promote-1.0') && needs.promotion-gate.result == 'success' }}
    # Promotion-gate is the single dependency that carries the exact,
    # evidence-bound candidate into publication.
    needs: promotion-gate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          lfs: false
          fetch-depth: 1
      - name: Pin release orchestration commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.promotion-gate.outputs.promoted-artifact-id }}
          merge-multiple: true
          path: candidate
      - name: Publish only missing immutable GitHub assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          python3 maintenance/tools/publish_github_candidate.py \
            --candidate candidate \
            --repository "$GITHUB_REPOSITORY" \
            --publish

  publish-gitlab:
    name: Publish exact installer mirror to GitLab
    if: ${{ always() && (inputs.mode == 'promote-rc' || inputs.mode == 'promote-1.0') && needs.promotion-gate.result == 'success' && needs.publish-assets.result == 'success' }}
    needs: [promotion-gate, publish-assets]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          lfs: false
          fetch-depth: 1
      - name: Pin release orchestration commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.promotion-gate.outputs.promoted-artifact-id }}
          merge-multiple: true
          path: candidate
      - name: Publish only missing immutable GitLab installer mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          python3 maintenance/tools/publish_gitlab_candidate.py \
            --candidate candidate \
            --publish

  verify-release-mirrors:
    name: Verify every public mirror after publication
    if: ${{ always() && (inputs.mode == 'promote-rc' || inputs.mode == 'promote-1.0') && needs.promotion-gate.result == 'success' && needs.publish-assets.result == 'success' && needs.publish-gitlab.result == 'success' }}
    # verify-mirrors is the public mirror gate.
    needs: [promotion-gate, publish-assets, publish-gitlab]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          lfs: false
          fetch-depth: 1
      - name: Pin release orchestration commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.promotion-gate.outputs.promoted-artifact-id }}
          merge-multiple: true
          path: candidate
      - name: Verify GitHub and GitLab bytes from the candidate pin
        env:
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 maintenance/tools/verify_release_mirrors.py \
            --candidate candidate \
            --catalog candidate/catalog.json \
            --expected-release "$CANDIDATE_VERSION"

  metadata-last:
    name: Publish the verified site generation last
    if: ${{ always() && (inputs.mode == 'promote-rc' || inputs.mode == 'promote-1.0') && needs.promotion-gate.result == 'success' && needs.verify-release-mirrors.result == 'success' }}
    needs: [promotion-gate, verify-release-mirrors]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          lfs: false
          fetch-depth: 1
      - name: Pin release orchestration commit
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          git fetch --no-tags origin "$RELEASE_COMMIT"
          git checkout --detach "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned trust dependencies from vendored wheels
        run: python -m pip install --no-index --find-links maintenance/vendor/wheels --require-hashes -r maintenance/requirements-trust.txt
      - name: Validate authorized signed metadata handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          RELEASE_COMMIT: ${{ github.sha }}
          TUF_RUN_ID: ${{ fromJSON(inputs.tuf_metadata_handoff).run_id }}
          TUF_ARTIFACT_ID: ${{ fromJSON(inputs.tuf_metadata_handoff).artifact_id }}
          TUF_ARTIFACT_NAME: ${{ fromJSON(inputs.tuf_metadata_handoff).artifact_name }}
          TUF_WORKFLOW: ${{ fromJSON(inputs.tuf_metadata_handoff).workflow }}
        run: |
          [[ "$TUF_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TUF_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$TUF_ARTIFACT_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,199}$ ]]
          python3 maintenance/tools/verify_external_handoff.py \
            --run-id "$TUF_RUN_ID" \
            --commit "$RELEASE_COMMIT" \
            --artifact "$TUF_ARTIFACT_NAME" \
            --artifact-id "$TUF_ARTIFACT_ID" \
            --workflow "$TUF_WORKFLOW" \
            --head-branch main \
            --output "$RUNNER_TEMP/tuf-run.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.promotion-gate.outputs.promoted-artifact-id }}
          merge-multiple: true
          path: candidate
      - name: Verify durable evidence in the post-publish candidate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 maintenance/tools/release_receipt.py verify \
            --candidate candidate \
            --trust-root maintenance/trust/m3-root.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ fromJSON(inputs.tuf_metadata_handoff).artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ fromJSON(inputs.tuf_metadata_handoff).run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: signed-tuf
      - name: Authenticate signed TUF against the exact candidate catalog
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 maintenance/tools/publish_tuf_metadata.py \
            --metadata-dir signed-tuf \
            --root maintenance/trust/root.json \
            --catalog candidate/catalog.json \
            --stage-dir release-work/trust
      - name: Assemble one immutable public site tree
        run: |
          mkdir -p release-work/site
          cp site/wrangler.jsonc release-work/site/wrangler.jsonc
          python3 maintenance/tools/assemble_site_release.py \
            --site-source candidate/site/public \
            --catalog candidate/catalog.json \
            --product candidate/product.json \
            --trust-repository release-work/trust \
            --output release-work/site/public
      - name: Dry-run the exact public site before deployment
        working-directory: site
        run: |
          npm ci
          node_modules/.bin/wrangler deploy \
            --config ../release-work/site/wrangler.jsonc \
            --dry-run
      - name: Deploy the verified site generation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          site/node_modules/.bin/wrangler deploy \
            --config release-work/site/wrangler.jsonc
      - name: Verify public TUF after deployment
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -u
          for attempt in 1 2 3 4 5; do
            if python3 maintenance/tools/verify_public_tuf.py \
              --root maintenance/trust/root.json \
              --catalog candidate/catalog.json && \
              python3 maintenance/tools/verify_public_bootstraps.py --candidate candidate && \
              python3 maintenance/tools/verify_public_product.py --candidate candidate; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "public endpoint did not converge after ${attempt}/5 attempts" >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "public endpoint not ready; retrying in ${delay}s (attempt ${attempt}/5)" >&2
            sleep "$delay"
          done
      - name: Record metadata-last post-publish result
        run: |
          echo "metadata-last verified candidate catalog, product, bootstraps, signed TUF and public endpoint" >> "$GITHUB_STEP_SUMMARY"
