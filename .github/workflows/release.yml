name: Release gate

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Digite PUBLICAR X86QW para liberar a etapa protegida"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: x86qw-release
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  publish:
    name: Publish immutable catalog artifacts
    needs: validate
    if: ${{ inputs.confirmation == 'PUBLICAR X86QW' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install authenticated GitLab client
        run: |
          sudo apt-get update
          sudo apt-get install --yes glab
      - name: Revalidate immutable inputs
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          test "${GITHUB_REF}" = "refs/heads/main"
          git lfs pull
          git lfs fsck
          python3 maintenance/tools/check_lfs.py
          ./maintenance/manage.py verify
          ./maintenance/manage.py build
          ./maintenance/manage.py verify --no-tests
          git diff --exit-code
      - name: Validate publication plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./maintenance/manage.py publish --dry-run
      - name: Publish after protected-environment approval
        env:
          GH_TOKEN: ${{ github.token }}
          GLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          GLAB_TOKEN="${GLAB_TOKEN//$'\r'/}"
          GLAB_TOKEN="${GLAB_TOKEN//$'\n'/}"
          test -n "${GLAB_TOKEN}"
          export GLAB_TOKEN
          export GITLAB_TOKEN="${GLAB_TOKEN}"
          ./maintenance/manage.py publish
