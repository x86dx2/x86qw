name: Windows e2e

# End-to-end check of the Windows path, nightly and on changes to the
# bootstrap: the served install.ps1, the move from 2.4.2, setup, shortcuts,
# private ACLs, background services and uninstall. It installs the
# complete profile (about 1 GB).
on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "site/public/install.ps1"
      - "go/cmd/x86qw-release/templates/install.ps1"

permissions:
  contents: read

jobs:
  smoke:
    name: windows e2e
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
      # The site challenges GitHub's Windows runner IPs (Cloudflare "Just a
      # moment..."), so the served install.ps1 runs from the checkout and the
      # catalog comes from the repository instead of the site's TUF chain.
      - name: The served install.ps1 installs the essential profile (repository copy)
        run: |
          $ErrorActionPreference = "Stop"
          $served = Join-Path $env:RUNNER_TEMP "served"
          # Its shortcuts go to a profile of its own.
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "served-appdata"
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "served-profile"
          & .\site\public\install.ps1 --target $served --profile essential --catalog-file "$PWD\site\public\api\v1\catalog.json"
          if ($LASTEXITCODE -ne 0) { throw "setup failed: $LASTEXITCODE" }
          $cli = @("$served\x86qw.exe", "$served\x86qw.cmd") | Where-Object { Test-Path $_ } | Select-Object -First 1
          & $cli verify --target $served; if ($LASTEXITCODE -ne 0) { throw "verify" }
          & $cli uninstall --yes --target $served; if ($LASTEXITCODE -ne 0) { throw "uninstall" }
      - name: Install 2.4.2, the last layout with x86qw.cmd
        run: |
          $ErrorActionPreference = "Stop"
          $inst = Join-Path $env:RUNNER_TEMP "inst"
          # Its bootstrap is frozen here, pinned like the served one.
          & .\.github\e2e\install-2.4.2.ps1 --target $inst --profile complete --catalog-file "$PWD\site\public\api\v1\catalog.json"
          if ($LASTEXITCODE -ne 0) { throw "setup failed: $LASTEXITCODE" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: An older CLI's update moves to the CLI at the root
        run: |
          $ErrorActionPreference = "Stop"
          $inst = Join-Path $env:RUNNER_TEMP "inst"
          # The published CLI integrates everything through its x86qw.cmd.
          & "$inst\x86qw.cmd" setup --target $inst --catalog-file "$PWD\site\public\api\v1\catalog.json" `
            --intent play --nick tester --content complete --integrate shortcuts,path,qw-links,demos --yes
          if ($LASTEXITCODE -ne 0) { throw "recipe: $LASTEXITCODE" }
          # What an older CLI's update leaves: the new binary, with its
          # receipt, where the old one lived. A real version: a development
          # build never moves an installation.
          go -C go build -ldflags "-X github.com/x86dx2/x86qw/go/internal/buildinfo.Version=9.9.9-e2e" -o "$inst\.x86qw\cli\x86qw.exe" ./cmd/x86qw
          Set-Content -Path "$inst\.x86qw\cli\receipt" -NoNewline -Value '{"format":1,"min_cli_version":"0.7.0","project":"x86qw","receipt_version":1,"version":"9.9.9-e2e"}'
          # Its first run, through the old launcher, moves the installation.
          & "$inst\x86qw.cmd" version
          if ($LASTEXITCODE -ne 0) { throw "version: $LASTEXITCODE" }
          if (-not (Test-Path "$inst\x86qw.exe")) { throw "no x86qw.exe at the root" }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path "$inst\x86qw.cmd") -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (Test-Path "$inst\x86qw.cmd") { throw "x86qw.cmd stayed after the cmd.exe running it ended" }
          if (Test-Path "$inst\.x86qw\cli\x86qw.exe") { throw "the old binary stayed in .x86qw\cli" }
          $command = (Get-ItemProperty "HKCU:\Software\Classes\qw\shell\open\command").'(default)'
          if (-not $command.StartsWith("`"$inst\x86qw.exe`"")) { throw "qw:// still runs: $command" }
          foreach ($lnk in @("$env:APPDATA\Microsoft\Windows\Start Menu\Programs\x86QW.lnk", "$env:USERPROFILE\Desktop\x86QW.lnk")) {
            $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
            if ($target -ne "$inst\x86qw.exe") { throw "$lnk still points at $target" }
          }
          & "$inst\x86qw.exe" version
      - name: Running the bootstrap again moves a 2.4.2 installation
        run: |
          $ErrorActionPreference = "Stop"
          $again = Join-Path $env:RUNNER_TEMP "again"
          # A second installation, with shortcuts in a profile of its own.
          $env:APPDATA = Join-Path $env:RUNNER_TEMP "again-appdata"
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP "again-profile"
          & .\.github\e2e\install-2.4.2.ps1 --target $again --profile essential --catalog-file "$PWD\site\public\api\v1\catalog.json"
          if ($LASTEXITCODE -ne 0) { throw "2.4.2 setup: $LASTEXITCODE" }
          # What a newer bootstrap runs: its CLI, from a temporary folder,
          # adopting the installation.
          Copy-Item "$inst\x86qw.exe" "$env:RUNNER_TEMP\x86qw-bootstrap.exe"
          & "$env:RUNNER_TEMP\x86qw-bootstrap.exe" setup --target $again --catalog-file "$PWD\site\public\api\v1\catalog.json"
          if ($LASTEXITCODE -ne 0) { throw "adoption: $LASTEXITCODE" }
          foreach ($gone in @("$again\x86qw.cmd", "$again\.x86qw\cli\x86qw.exe")) {
            if (Test-Path $gone) { throw "$gone stayed" }
          }
          foreach ($lnk in @("$env:APPDATA\Microsoft\Windows\Start Menu\Programs\x86QW.lnk", "$env:USERPROFILE\Desktop\x86QW.lnk")) {
            $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
            if ($target -ne "$again\x86qw.exe") { throw "$lnk points at $target" }
          }
          & "$again\x86qw.exe" uninstall --yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall: $LASTEXITCODE" }
      - name: qw:// links and demos through the Windows handlers
        run: |
          $ErrorActionPreference = "Stop"
          $inst = Join-Path $env:RUNNER_TEMP "inst"
          # The handlers the published CLI made, as the move rewrote them.
          # The command the registry keeps for qw://, with --dry-run so no
          # ezQuake starts on the runner.
          $link = "qw://2@qtv.example.org:28000/qtvplay"
          $command = (Get-ItemProperty "HKCU:\Software\Classes\qw\shell\open\command").'(default)'
          Write-Host "qw:// -> $command"
          $exe = ($command -split '"')[1]
          $arguments = $command.Substring($exe.Length + 2).Replace('"%1"', "--dry-run `"$link`"")
          $out = Join-Path $env:RUNNER_TEMP "link.out"
          Start-Process -FilePath $exe -ArgumentList $arguments -RedirectStandardOutput $out -NoNewWindow -Wait
          $printed = Get-Content $out -Raw
          if ($printed -notmatch [regex]::Escape("+qwurl $link")) { throw "the qw:// handler did not open the link: $printed" }
          # A click: without "URL Protocol" the shell does not hand the link
          # to the handler, which starts ezQuake with +qwurl.
          if ($null -eq (Get-ItemProperty "HKCU:\Software\Classes\qw").'URL Protocol') { throw "qw without URL Protocol" }
          Start-Process $link
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Milliseconds 250
            $started = @(Get-CimInstance Win32_Process -Filter "Name LIKE 'ezquake%'" | Where-Object { $_.CommandLine -like "*+qwurl $link*" })
          } while ($started.Count -eq 0 -and (Get-Date) -lt $deadline)
          if ($started.Count -eq 0) { throw "clicking the link did not start ezQuake with +qwurl" }
          Write-Host "click -> $($started[0].CommandLine)"
          Get-Process ezquake* -ErrorAction SilentlyContinue | Stop-Process -Force
          # A demo opened by the shell, as a double click does: the handler
          # copies it into qw\demos before starting ezQuake.
          $demo = Join-Path $env:RUNNER_TEMP "final.mvd"
          Set-Content -Path $demo -Value "demo bytes" -NoNewline
          Start-Process $demo
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 1
            $copied = @(Get-ChildItem (Join-Path $inst "qw\demos") -Filter "x86qw-open-*.mvd" -ErrorAction SilentlyContinue)
          } while ($copied.Count -eq 0 -and (Get-Date) -lt $deadline)
          if ($copied.Count -eq 0) { throw "the demo did not reach the handler" }
          Get-Process ezquake* -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: A new terminal finds x86qw on the PATH
        run: |
          $ErrorActionPreference = "Stop"
          $inst = Join-Path $env:RUNNER_TEMP "inst"
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          if (@($userPath -split ";" | ForEach-Object { $_.TrimEnd("\") }) -notcontains $inst.TrimEnd("\")) { throw "the installation is not on the user PATH: $userPath" }
          # A new terminal builds its PATH from the registry, not from this one.
          $fresh = [Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + $userPath
          $found = & powershell -NoProfile -Command { param($path) $env:Path = $path; (Get-Command x86qw).Source; x86qw version } -args $fresh
          Write-Host ($found -join "`n")
          if (-not ($found -match "x86qw\.exe$") -or -not ($found -match "^x86QW ")) { throw "a new terminal does not run x86qw" }
      - name: A local KTX match starts ezQuake
        run: |
          $ErrorActionPreference = "Stop"
          $inst = Join-Path $env:RUNNER_TEMP "inst"
          & "$inst\x86qw.exe" play ktx --mode duel --map dm6 --target $inst
          if ($LASTEXITCODE -ne 0) { throw "play: $LASTEXITCODE" }
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Milliseconds 250
            $started = @(Get-CimInstance Win32_Process -Filter "Name LIKE 'ezquake%'" | Where-Object { $_.CommandLine -like "*k_defmap dm6*" })
          } while ($started.Count -eq 0 -and (Get-Date) -lt $deadline)
          if ($started.Count -eq 0) { throw "play did not start ezQuake with the match" }
          Write-Host "play -> $($started[0].CommandLine)"
          Get-Process ezquake* -ErrorAction SilentlyContinue | Stop-Process -Force
      - name: verify, doctor, shortcuts and ACL
        run: |
          $ErrorActionPreference = "Stop"
          $inst = Join-Path $env:RUNNER_TEMP "inst"
          Set-Location $inst
          .\x86qw.exe verify; if ($LASTEXITCODE -ne 0) { throw "verify" }
          .\x86qw.exe doctor; if ($LASTEXITCODE -ne 0) { throw "doctor" }
          foreach ($lnk in @("$env:APPDATA\Microsoft\Windows\Start Menu\Programs\x86QW.lnk", "$env:USERPROFILE\Desktop\x86QW.lnk")) {
            if (-not (Test-Path -LiteralPath $lnk -PathType Leaf)) { throw "missing shortcut: $lnk" }
            $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
            Write-Host "shortcut $lnk -> $target"
          }
          icacls .x86qw
          $sddl = (Get-Acl .x86qw).Sddl
          Write-Host $sddl
          if ($sddl -notmatch "D:P") { throw "the .x86qw DACL is not protected" }
      - name: The app opens in a real console (ConPTY)
        env:
          X86QW_CONPTY_TARGET: ${{ runner.temp }}\inst
        run: |
          go -C go test -count=1 -run TestAppOpensInARealConsole -v ./cmd/x86qw
          if ($LASTEXITCODE -ne 0) { throw "app in a console: $LASTEXITCODE" }
      - name: Host KTX in the background, query and stop it
        run: |
          $ErrorActionPreference = "Stop"
          $inst = Join-Path $env:RUNNER_TEMP "inst"
          Set-Location $inst
          .\x86qw.exe host ktx --mode duel --map dm6 --background
          if ($LASTEXITCODE -ne 0) { throw "host --background: $LASTEXITCODE" }
          $active = $false
          for ($i = 0; $i -lt 30; $i++) {
            $out = .\x86qw.exe status | Out-String
            if ($out -match "MVDSV") { $active = $true; Write-Host $out; break }
            Start-Sleep -Seconds 1
          }
          if (-not $active) { .\x86qw.exe status; throw "the stack did not come up" }
          Get-Process mvdsv
          .\x86qw.exe status --stop --yes
          if ($LASTEXITCODE -ne 0) { throw "status --stop: $LASTEXITCODE" }
          Start-Sleep -Seconds 2
          if (Get-Process mvdsv -ErrorAction SilentlyContinue) { throw "mvdsv survived the stop" }
          $out = .\x86qw.exe status | Out-String
          Write-Host $out
          if ($out -notmatch "No x86QW service") { throw "the stack is still running" }
      - name: Uninstall removes the shortcuts and the CLI
        run: |
          $ErrorActionPreference = "Stop"
          $inst = Join-Path $env:RUNNER_TEMP "inst"
          & "$inst\x86qw.exe" uninstall --yes
          if ($LASTEXITCODE -ne 0) { throw "uninstall: $LASTEXITCODE" }
          if (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\x86QW.lnk") { throw "the Start Menu shortcut stayed" }
          if (Test-Path "$env:USERPROFILE\Desktop\x86QW.lnk") { throw "the Desktop shortcut stayed" }
          if (Test-Path "HKCU:\Software\Classes\qw") { throw "the qw:// handler stayed in the registry" }
          if (@([Environment]::GetEnvironmentVariable("Path", "User") -split ";" | ForEach-Object { $_.TrimEnd("\") }) -contains $inst.TrimEnd("\")) { throw "the installation stayed on the user PATH" }
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 1
            $left = @(Get-ChildItem -Force (Join-Path $inst ".x86qw") -ErrorAction SilentlyContinue | Where-Object Name -match "quarantine")
            if (Test-Path "$inst\x86qw.exe") { $left += "x86qw.exe" }
          } while ($left.Count -gt 0 -and (Get-Date) -lt $deadline)
          if ($left.Count -gt 0) { throw "not removed after exit: $($left -join ', ')" }
          Write-Host "CLI removed after exit; left: $((Get-ChildItem -Force (Join-Path $inst '.x86qw')).Name -join ', ')"
          exit 0

  report:
    name: Report a failed night
    needs: smoke
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const marker = '<!-- x86qw-e2e-alert -->';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = `${marker}\nThe nightly Windows end-to-end install failed: ${runUrl}`;
            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'P1', per_page: 100 });
            const existing = open.find((issue) => !issue.pull_request && (issue.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: 'Nightly end-to-end install failed', labels: ['P1'], body });
            }
