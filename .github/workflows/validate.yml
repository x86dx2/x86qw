name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: portable-contract / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
            seed_lfs: true
          - os: ubuntu-latest
            python: "3.13"
            seed_lfs: false
          - os: macos-latest
            python: "3.10"
            seed_lfs: false
          - os: macos-latest
            python: "3.13"
            seed_lfs: false
          - os: windows-latest
            python: "3.10"
            seed_lfs: false
          - os: windows-latest
            python: "3.13"
            seed_lfs: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: lfs-cache
        with:
          path: .git/lfs/objects
          key: x86qw-lfs-v1-${{ hashFiles('dist/**', '.gitattributes') }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned trust dependencies from vendored wheels
        shell: bash
        run: python -m pip install --no-index --find-links maintenance/vendor/wheels --require-hashes -r maintenance/requirements-trust.txt
      - name: Restore or fetch the single LFS materialization
        shell: bash
        run: |
          if [ "${{ steps.lfs-cache.outputs.cache-hit }}" = "true" ]; then
            git lfs checkout
          elif [ "${{ matrix.seed_lfs }}" = "true" ]; then
            python maintenance/tools/materialize_lfs.py \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA"
            git lfs checkout
          else
            echo "[ERRO] cache LFS ausente fora do job seed" >&2
            exit 1
          fi
          git lfs fsck --pointers
          python maintenance/tools/check_lfs.py
          python maintenance/tools/check_committed_diff.py
      - name: Verify contracts without executing native claims
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python maintenance/manage.py verify --no-tests
      - name: Run portable maintenance tests
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          X86QW_CI_PORTABLE: "1"
        run: python -m unittest discover -s maintenance/tests -v
      - name: Run Windows preview contract
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          X86QW_CI_PORTABLE: "1"
        run: |
          python -c '
          import pathlib
          import subprocess
          import sys

          windows_preview_excluded = {
              "test_gameplay_ktx_runtime_recovery",
              "test_installer",
              "test_installer_purge_transaction",
              "test_installation_changes",
              "test_migration_1_0",
              "test_migration_manager",
              "test_modern_components",
              "test_native_case_entrypoint",
              "test_native_m3_harness",
              "test_native_release_evidence",
              "test_native_release_smoke",
              "test_platform_processes",
              "test_quarantine",
              "test_runtime_host",
          }
          modules = [
              f"maintenance.tests.{path.stem}"
              for path in sorted(pathlib.Path("maintenance/tests").glob("test_*.py"))
              if path.stem not in windows_preview_excluded
          ]
          print("Windows preview exclusions:", ", ".join(sorted(windows_preview_excluded)))
          raise SystemExit(subprocess.call([sys.executable, "-m", "unittest", *modules, "-v"]))
          '
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Validate site from lockfile
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        working-directory: site
        shell: bash
        run: |
          npm ci
          npm run deploy:dry-run
          python -m unittest discover -s tests -v

  native-contract:
    name: native-contract / no support claim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          lfs: false
      - name: Check native evidence contract only
        run: |
          test -f x86qw_runtime/contracts/native_evidence.py
          test -f maintenance/tools/native_release_smoke.py
          test -f maintenance/tools/native_release_evidence.py
          test -f maintenance/tools/release_evidence_binding.py
          echo "Portable CI does not substitute for Apple M3 execution."
