name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR replaces its run; runs on main always finish.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lfs-seed:
    name: portable-contract / LFS seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
      # The cache is keyed on the set of LFS objects, not on the commit, so
      # runs share it; a new object restores the closest set and fetches
      # only what is missing.
      - name: Key the LFS cache on its objects
        id: lfs-key
        run: echo "key=x86qw-lfs-v4-$(git lfs ls-files --long | sort | sha256sum | cut -c1-32)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: lfs-cache
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs-key.outputs.key }}
          restore-keys: x86qw-lfs-v4-
          enableCrossOsArchive: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Build the content tool
        run: go -C go build -o "$RUNNER_TEMP/x86qw-content" ./cmd/x86qw-content
      - name: Materialize the single LFS cache
        shell: bash
        run: |
          if [ "${{ steps.lfs-cache.outputs.cache-hit }}" != "true" ]; then
            "$RUNNER_TEMP/x86qw-content" --root "$GITHUB_WORKSPACE" lfs-materialize \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA"
          fi
          git lfs checkout
          git lfs fsck --pointers
      # Saved before verify so a data-check failure here does not also starve
      # the other jobs of the verified LFS objects.
      - uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        if: ${{ steps.lfs-cache.outputs.cache-hit != 'true' }}
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs-key.outputs.key }}
          enableCrossOsArchive: true
      - name: Verify the distribution and repository hygiene
        run: '"$RUNNER_TEMP/x86qw-content" --root "$GITHUB_WORKSPACE" verify'

  site:
    name: portable-contract / site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Validate site from lockfile
        working-directory: site
        shell: bash
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npm run deploy:dry-run
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      # The same assembly the deploy ships: the current TUF generation only,
      # the provenance files and the no-store headers.
      - name: Dry-run the assembled site
        run: |
          go -C go build -o "$RUNNER_TEMP/x86qw-release" ./cmd/x86qw-release
          "$RUNNER_TEMP/x86qw-release" site --source site/public --out "$RUNNER_TEMP/site/public" --commit "$GITHUB_SHA"
          cp site/wrangler.jsonc "$RUNNER_TEMP/site/wrangler.jsonc"
          site/node_modules/.bin/wrangler deploy --config "$RUNNER_TEMP/site/wrangler.jsonc" \
            --assets "$RUNNER_TEMP/site/public" --dry-run --strict
