name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Materialize and verify Git LFS
        run: |
          git lfs pull
          git lfs fsck
          python3 maintenance/tools/check_lfs.py
      - name: Verify distribution and test suites
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: ./maintenance/manage.py verify
      - name: Reject malformed diffs
        run: python3 maintenance/tools/check_committed_diff.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Validate Cloudflare static assets from lockfile
        working-directory: site
        run: |
          npm ci
          npm run deploy:dry-run

  portable:
    name: portable-contract / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Materialize and verify Git LFS
        shell: bash
        run: |
          git lfs pull
          git lfs fsck
          python maintenance/tools/check_lfs.py
      - name: Validate catalogs, schemas, paths and bundle inputs
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python maintenance/manage.py verify --no-tests
      - name: Run portable installer and runtime tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          X86QW_CI_PORTABLE: "1"
        run: python -m unittest discover -s maintenance/tests -v
      - name: Run site contract tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s site/tests -v
      - name: Parse every public CLI surface
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python dist/installer/bin/manager.py --help >/dev/null
          python dist/installer/bin/manager.py play --help >/dev/null
          python dist/installer/bin/manager.py host --help >/dev/null
          python dist/installer/bin/manager.py proxy --help >/dev/null
          python dist/installer/bin/manager.py qtv --help >/dev/null

  # Keep the protected contexts from the pre-1.0 matrix while the public job
  # names make the portable/native boundary explicit.
  portable-legacy-context:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: portable
    if: ${{ always() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - name: Mirror the portable contract result
        shell: bash
        run: test "${{ needs.portable.result }}" = success

# Keep the pull_request gate visible when the branch is synchronized. The
# legacy names remain protected contexts until branch protection is migrated;
# each mirrors the aggregate portable contract result.
