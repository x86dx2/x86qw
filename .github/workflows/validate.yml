name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      run_preview:
        description: "Executa o preview opcional em outros sistemas operacionais"
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      run_preview:
        description: "Executa o preview opcional em outros sistemas operacionais"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lfs-seed:
    name: portable-contract / LFS seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: lfs-cache
        with:
          path: .git/lfs/objects
          key: x86qw-lfs-v3-${{ github.event.pull_request.head.sha || github.sha }}
          enableCrossOsArchive: true
      - name: Materialize the single LFS cache
        shell: bash
        run: |
          if [ "${{ steps.lfs-cache.outputs.cache-hit }}" != "true" ]; then
            python3 maintenance/tools/materialize_lfs.py \
              --repository "$GITHUB_REPOSITORY" \
              --commit "$GITHUB_SHA"
          fi
          git lfs checkout
          git lfs fsck --pointers
          python3 maintenance/tools/check_lfs.py
          python3 maintenance/tools/check_committed_diff.py

  portable:
    name: portable-contract / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: lfs-seed
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python: "3.10"
          - os: macos-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: lfs-cache
        with:
          path: .git/lfs/objects
          key: x86qw-lfs-v3-${{ github.event.pull_request.head.sha || github.sha }}
          enableCrossOsArchive: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned trust dependencies from vendored wheels
        shell: bash
        run: python -m pip install --no-index --find-links maintenance/vendor/wheels --require-hashes -r maintenance/requirements-trust.txt
      - name: Restore or fetch the single LFS materialization
        shell: bash
        run: |
          if [ "${{ steps.lfs-cache.outputs.cache-hit }}" != "true" ]; then
            echo "[ERRO] cache LFS ausente fora do job seed" >&2
            exit 1
          fi
          git lfs checkout
          git lfs fsck --pointers
          python maintenance/tools/check_lfs.py
          python maintenance/tools/check_committed_diff.py
      - name: Verify contracts without executing native claims
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python maintenance/manage.py verify --no-tests
      - name: Run portable maintenance tests
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          X86QW_CI_PORTABLE: "1"
        run: python -m unittest discover -s maintenance/tests -v

  site:
    name: portable-contract / site
    needs: lfs-seed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: lfs-cache
        with:
          path: .git/lfs/objects
          key: x86qw-lfs-v3-${{ github.event.pull_request.head.sha || github.sha }}
          enableCrossOsArchive: true
      - name: Restore or fetch the single LFS materialization
        shell: bash
        run: |
          if [ "${{ steps.lfs-cache.outputs.cache-hit }}" != "true" ]; then
            echo "[ERRO] cache LFS ausente fora do job seed" >&2
            exit 1
          fi
          git lfs checkout
          git lfs fsck --pointers
          python3 maintenance/tools/check_lfs.py
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate site from lockfile
        working-directory: site
        shell: bash
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
          npm run deploy:dry-run
          python -m unittest discover -s tests -v

  preview-other-os:
    name: preview-contract / ${{ matrix.os }} / Python ${{ matrix.python }}
    if: inputs.run_preview == true
    needs: lfs-seed
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.10"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          lfs: false
      - uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        id: lfs-cache
        with:
          path: .git/lfs/objects
          key: x86qw-lfs-v3-${{ github.event.pull_request.head.sha || github.sha }}
          enableCrossOsArchive: true
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned trust dependencies from vendored wheels
        shell: bash
        run: python -m pip install --no-index --find-links maintenance/vendor/wheels --require-hashes -r maintenance/requirements-trust.txt
      - name: Restore or fetch the single LFS materialization
        shell: bash
        run: |
          if [ "${{ steps.lfs-cache.outputs.cache-hit }}" != "true" ]; then
            echo "[ERRO] cache LFS ausente fora do job seed" >&2
            exit 1
          fi
          git lfs checkout
          git lfs fsck --pointers
          python maintenance/tools/check_lfs.py
          python maintenance/tools/check_committed_diff.py
      - name: Run Windows preview contract
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          X86QW_CI_PORTABLE: "1"
        run: |
          python -c '
          import pathlib
          import subprocess
          import sys

          windows_preview_excluded = {
              "test_gameplay_ktx_runtime_recovery",
              "test_installer",
              "test_installer_purge_transaction",
              "test_installation_changes",
              "test_migration_1_0",
              "test_migration_manager",
              "test_modern_components",
              "test_native_case_entrypoint",
              "test_native_m3_harness",
              "test_native_release_evidence",
              "test_native_release_smoke",
              "test_platform_processes",
              "test_quarantine",
              "test_runtime_host",
          }
          modules = [
              f"maintenance.tests.{path.stem}"
              for path in sorted(pathlib.Path("maintenance/tests").glob("test_*.py"))
              if path.stem not in windows_preview_excluded
          ]
          print("Windows preview exclusions:", ", ".join(sorted(windows_preview_excluded)))
          raise SystemExit(subprocess.call([sys.executable, "-m", "unittest", *modules, "-v"]))
          '

  native-contract:
    name: native-contract / no support claim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 1
          lfs: false
      - name: Check native evidence contract only
        run: |
          test -f x86qw_runtime/contracts/native_evidence.py
          test -f maintenance/tools/native_release_smoke.py
          test -f maintenance/tools/native_release_evidence.py
          test -f maintenance/tools/release_evidence_binding.py
          echo "Portable CI does not substitute for Apple M3 execution."
