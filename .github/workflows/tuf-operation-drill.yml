name: Register accountable TUF operation drill

on:
  workflow_dispatch:
    inputs:
      candidate_artifact_id:
        description: "Artifact ID imutável produzido pelo build-once"
        required: true
        type: string
      candidate_artifact_name:
        description: "Nome exato do artifact produzido pelo build-once"
        required: true
        type: string
      candidate_run_id:
        description: "Run que produziu o candidato imutável"
        required: true
        type: string
      candidate_commit:
        description: "SHA completo do commit candidato"
        required: true
        type: string
      candidate_sha256:
        description: "SHA-256 exato de candidate.json"
        required: true
        type: string
      operation_report_b64:
        description: "Relatório JSON do drill TUF, base64, sem chaves ou segredos"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: x86qw-tuf-operation-${{ inputs.candidate_commit }}
  cancel-in-progress: false

jobs:
  handoff:
    name: Verify and register exact TUF operation report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_commit }}
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate bounded coordinates
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          OPERATION_REPORT_B64: ${{ inputs.operation_report_b64 }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$CANDIDATE_ARTIFACT_NAME" =~ ^candidate-[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -n "$OPERATION_REPORT_B64"
          test "${#OPERATION_REPORT_B64}" -le 4194304
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
      - name: Verify candidate artifact provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
        run: |
          python3 maintenance/tools/verify_external_handoff.py \
            --run-id "$CANDIDATE_RUN_ID" \
            --commit "$CANDIDATE_COMMIT" \
            --artifact "$CANDIDATE_ARTIFACT_NAME" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --workflow .github/workflows/release.yml \
            --output "$RUNNER_TEMP/candidate-artifact.json"
      - name: Download and verify exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: candidate
      - name: Verify candidate bytes
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          actual="$(python3 -c 'import hashlib; print(hashlib.sha256(open("candidate/candidate.json", "rb").read()).hexdigest())')"
          test "$actual" = "$EXPECTED_CANDIDATE_SHA256"
          python3 maintenance/tools/release_candidate.py verify candidate
      - name: Decode bounded operation report
        env:
          OPERATION_REPORT_B64: ${{ inputs.operation_report_b64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/tuf-operation"
          OPERATION_REPORT_B64="$OPERATION_REPORT_B64" python3 - "$RUNNER_TEMP/tuf-operation/report.json" <<'PY'
          import base64
          import os
          import sys
          from pathlib import Path

          try:
              payload = base64.b64decode(os.environ["OPERATION_REPORT_B64"], validate=True)
          except (ValueError, UnicodeEncodeError) as error:
              raise SystemExit(f"operation report base64 inválido: {error}")
          if not payload or len(payload) > 2 * 1024 * 1024:
              raise SystemExit("operation report ausente ou excede 2 MiB")
          Path(sys.argv[1]).write_bytes(payload)
          PY
      - name: Verify operation report against candidate target
        run: |
          python3 maintenance/tools/verify_tuf_operation_report.py \
            --candidate candidate \
            --report "$RUNNER_TEMP/tuf-operation/report.json" \
            > "$RUNNER_TEMP/tuf-operation/verified.json"
      - name: Record exact operation coordinates
        shell: bash
        run: |
          python3 - "$RUNNER_TEMP/tuf-operation/report.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import hashlib
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          report = json.loads(path.read_text(encoding="utf-8"))
          operation = report["operation"]
          print(f"report_sha256={hashlib.sha256(path.read_bytes()).hexdigest()}")
          print(f"operator={operation['operator']}")
          print(f"custody_host={operation['custody_host']}")
          print(f"timestamp_sla_hours={operation['timestamp_sla_hours']}")
          PY
      - name: Upload exact operation report without overwrite
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tuf-operation-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tuf-operation/report.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Record registered operation artifact coordinates
        shell: bash
        run: |
          {
            echo "operation_artifact_id=${{ steps.upload.outputs.artifact-id }}"
            echo "operation_artifact_digest=${{ steps.upload.outputs.artifact-digest }}"
            echo "operation_artifact_name=tuf-operation-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}"
          } >> "$GITHUB_STEP_SUMMARY"
