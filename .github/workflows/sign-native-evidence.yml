name: Assemble signed M3 evidence

on:
  workflow_dispatch:
    inputs:
      candidate_artifact_id:
        description: "Artifact ID imutável produzido pelo build-once"
        required: true
        type: string
      candidate_artifact_name:
        description: "Nome exato do artifact produzido pelo build-once"
        required: true
        type: string
      candidate_run_id:
        description: "Run ID que produziu o candidato"
        required: true
        type: string
      candidate_commit:
        description: "SHA completo do commit candidato"
        required: true
        type: string
      candidate_sha256:
        description: "SHA-256 exato de candidate.json"
        required: true
        type: string
      native_input_artifact_id:
        description: "Artifact ID do input M3 pending"
        required: true
        type: string
      native_input_run_id:
        description: "Run ID do workflow native-m3"
        required: true
        type: string
      native_input_artifact_name:
        description: "Nome exato do artifact native-m3-input"
        required: true
        type: string
      signatures_b64:
        description: "Envelope público de assinaturas JSON, codificado em base64"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: x86qw-sign-native-evidence-${{ inputs.candidate_sha256 }}
  cancel-in-progress: false

jobs:
  assemble:
    name: Verify provenance and assemble exact M3 evidence
    # ADR 0007 — solo maintainer waiver: the owner signs outside CI. The
    # cryptographic root remains 2-of-3; two distinct keys are required, but
    # this job never claims independent human review or handles private keys.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.candidate_commit }}
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate immutable coordinates
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          NATIVE_RUN_ID: ${{ inputs.native_input_run_id }}
          NATIVE_ARTIFACT_ID: ${{ inputs.native_input_artifact_id }}
          NATIVE_ARTIFACT_NAME: ${{ inputs.native_input_artifact_name }}
        run: |
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$CANDIDATE_ARTIFACT_NAME" =~ ^candidate-[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$NATIVE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$NATIVE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$NATIVE_ARTIFACT_NAME" =~ ^native-m3-input-[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_COMMIT"
      - name: Verify candidate build artifact provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
        run: |
          python3 maintenance/tools/verify_external_handoff.py \
            --run-id "$CANDIDATE_RUN_ID" \
            --commit "$CANDIDATE_COMMIT" \
            --artifact "$CANDIDATE_ARTIFACT_NAME" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --workflow .github/workflows/release.yml \
            --output "$RUNNER_TEMP/candidate-artifact.json"
      - name: Verify the native run and artifact provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NATIVE_RUN_ID: ${{ inputs.native_input_run_id }}
          NATIVE_ARTIFACT_ID: ${{ inputs.native_input_artifact_id }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          NATIVE_ARTIFACT_NAME: ${{ inputs.native_input_artifact_name }}
        run: |
          python3 maintenance/tools/verify_external_handoff.py \
            --run-id "$NATIVE_RUN_ID" \
            --commit "$CANDIDATE_COMMIT" \
            --artifact "$NATIVE_ARTIFACT_NAME" \
            --artifact-id "$NATIVE_ARTIFACT_ID" \
            --workflow .github/workflows/native-m3.yml \
            --output "$RUNNER_TEMP/native-run.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: candidate
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ inputs.native_input_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.native_input_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: native-input
      - name: Verify exact candidate and body identity
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          actual="$(python3 -c 'import hashlib; print(hashlib.sha256(open("candidate/candidate.json", "rb").read()).hexdigest())')"
          test "$actual" = "$EXPECTED_CANDIDATE_SHA256"
          test -f native-input/native-evidence-pending.json
          test -f native-input/release-evidence-body.json
          test -f native-input/records/macOS-ARM64.json
          python3 maintenance/tools/release_candidate.py verify candidate
      - name: Assemble and cryptographically verify the signed aggregate
        env:
          SIGNATURES_B64: ${{ inputs.signatures_b64 }}
          M3_TRUST_ROOT_B64: ${{ secrets.M3_TRUST_ROOT_B64 }}
        run: |
          test -n "$SIGNATURES_B64"
          test -n "$M3_TRUST_ROOT_B64"
          umask 077
          printf '%s' "$SIGNATURES_B64" | base64 --decode > "$RUNNER_TEMP/signatures.json"
          printf '%s' "$M3_TRUST_ROOT_B64" | base64 --decode > "$RUNNER_TEMP/m3-root.json"
          test -s "$RUNNER_TEMP/signatures.json"
          test -s "$RUNNER_TEMP/m3-root.json"
          versioned_root_b64="$(python3 -c 'import base64; print(base64.b64encode(open("maintenance/trust/m3-root.json", "rb").read()).decode("ascii"))')"
          test "$M3_TRUST_ROOT_B64" = "$versioned_root_b64" || {
            echo "M3 root secret diverges from the versioned public root" >&2
            exit 1
          }
          mkdir -p signed-evidence
          python3 -m maintenance.tools.assemble_release_evidence assemble \
            --candidate candidate \
            --records-dir native-input/records \
            --body native-input/release-evidence-body.json \
            --signatures "$RUNNER_TEMP/signatures.json" \
            --trust-root "$RUNNER_TEMP/m3-root.json" \
            --output signed-evidence/release-evidence.json
          python3 maintenance/tools/attach_release_evidence.py \
            --candidate candidate \
            --evidence signed-evidence \
            --output candidate-with-m3
          python3 maintenance/tools/release_candidate.py verify \
            candidate-with-m3 --trust-root "$RUNNER_TEMP/m3-root.json"
      - name: Upload the exact signed evidence without overwrite
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-m3-signed-${{ inputs.candidate_commit }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: signed-evidence/release-evidence.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
