name: Repair owner-only site projection

on:
  workflow_dispatch:
    inputs:
      release_code_commit:
        description: "Current main SHA containing this workflow and release truth projection"
        required: true
        type: string
      development_validate_run:
        description: "Green Validate run for release_code_commit"
        required: true
        type: string
      candidate_commit:
        description: "Exact historical candidate commit whose installer/catalog/TUF remain immutable"
        required: true
        type: string
      candidate_run_id:
        description: "Run that produced the exact candidate artifact"
        required: true
        type: string
      candidate_artifact_id:
        description: "Immutable candidate artifact ID"
        required: true
        type: string
      candidate_artifact_name:
        description: "Exact candidate artifact name"
        required: true
        type: string
      candidate_sha256:
        description: "SHA-256 of candidate.json"
        required: true
        type: string
      tuf_source_workflow_commit:
        description: "Commit that produced the authenticated source TUF handoff"
        required: true
        type: string
      tuf_source_run_id:
        description: "Source TUF handoff run"
        required: true
        type: string
      tuf_source_artifact_id:
        description: "Source TUF handoff artifact ID"
        required: true
        type: string
      tuf_source_artifact_name:
        description: "Exact source TUF handoff artifact name"
        required: true
        type: string
      tuf_renewal_run_id:
        description: "Timestamp-only renewal handoff run"
        required: true
        type: string
      tuf_renewal_artifact_id:
        description: "Timestamp-only renewal handoff artifact ID"
        required: true
        type: string
      tuf_renewal_artifact_name:
        description: "Exact timestamp-only renewal artifact name"
        required: true
        type: string
      tuf_renewal_report_sha256:
        description: "SHA-256 of the renewal report"
        required: true
        type: string
      tuf_timestamp_key_id:
        description: "Authorized timestamp key ID"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: x86qw-site-projection-repair
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify immutable bytes and deploy only the current site projection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.release_code_commit }}
          lfs: false
          fetch-depth: 1
      - name: Validate the pinned release-code checkout
        env:
          RELEASE_CODE_COMMIT: ${{ inputs.release_code_commit }}
          DEVELOPMENT_VALIDATE_RUN: ${{ inputs.development_validate_run }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_CODE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEVELOPMENT_VALIDATE_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
          test "$GITHUB_SHA" = "$RELEASE_CODE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RELEASE_CODE_COMMIT"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned trust dependencies from vendored wheels
        run: python -m pip install --no-index --find-links maintenance/vendor/wheels --require-hashes -r maintenance/requirements-trust.txt
      - name: Validate immutable handoff coordinates
        env:
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SOURCE_WORKFLOW_COMMIT: ${{ inputs.tuf_source_workflow_commit }}
          SOURCE_RUN_ID: ${{ inputs.tuf_source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.tuf_source_artifact_id }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.tuf_source_artifact_name }}
          RENEWAL_RUN_ID: ${{ inputs.tuf_renewal_run_id }}
          RENEWAL_ARTIFACT_ID: ${{ inputs.tuf_renewal_artifact_id }}
          RENEWAL_ARTIFACT_NAME: ${{ inputs.tuf_renewal_artifact_name }}
          RENEWAL_REPORT_SHA256: ${{ inputs.tuf_renewal_report_sha256 }}
          TIMESTAMP_KEY_ID: ${{ inputs.tuf_timestamp_key_id }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$CANDIDATE_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$CANDIDATE_ARTIFACT_NAME" =~ ^candidate-[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_WORKFLOW_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SOURCE_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SOURCE_ARTIFACT_NAME" =~ ^tuf-metadata-[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$RENEWAL_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$RENEWAL_ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$RENEWAL_ARTIFACT_NAME" =~ ^tuf-timestamp-renewal-[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$RENEWAL_REPORT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$TIMESTAMP_KEY_ID" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_ARTIFACT_NAME" == tuf-metadata-"$CANDIDATE_COMMIT"-* ]]
          [[ "$RENEWAL_ARTIFACT_NAME" == tuf-timestamp-renewal-"$CANDIDATE_COMMIT"-* ]]
      - name: Verify exact candidate handoff provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
        run: |
          python3 maintenance/tools/verify_external_handoff.py \
            --run-id "$CANDIDATE_RUN_ID" \
            --commit "$CANDIDATE_COMMIT" \
            --artifact "$CANDIDATE_ARTIFACT_NAME" \
            --artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --workflow .github/workflows/release.yml \
            --head-branch main \
            --output "$RUNNER_TEMP/candidate-provenance.json"
      - name: Verify exact source TUF handoff provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOURCE_WORKFLOW_COMMIT: ${{ inputs.tuf_source_workflow_commit }}
          SOURCE_RUN_ID: ${{ inputs.tuf_source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.tuf_source_artifact_id }}
          SOURCE_ARTIFACT_NAME: ${{ inputs.tuf_source_artifact_name }}
        run: |
          python3 maintenance/tools/verify_external_handoff.py \
            --run-id "$SOURCE_RUN_ID" \
            --commit "$SOURCE_WORKFLOW_COMMIT" \
            --artifact "$SOURCE_ARTIFACT_NAME" \
            --artifact-id "$SOURCE_ARTIFACT_ID" \
            --workflow .github/workflows/tuf-metadata-handoff.yml \
            --head-branch main \
            --output "$RUNNER_TEMP/source-tuf-provenance.json"
      - name: Verify exact timestamp renewal provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RENEWAL_WORKFLOW_COMMIT: ${{ inputs.tuf_source_workflow_commit }}
          RENEWAL_RUN_ID: ${{ inputs.tuf_renewal_run_id }}
          RENEWAL_ARTIFACT_ID: ${{ inputs.tuf_renewal_artifact_id }}
          RENEWAL_ARTIFACT_NAME: ${{ inputs.tuf_renewal_artifact_name }}
        run: |
          python3 maintenance/tools/verify_external_handoff.py \
            --run-id "$RENEWAL_RUN_ID" \
            --commit "$RENEWAL_WORKFLOW_COMMIT" \
            --artifact "$RENEWAL_ARTIFACT_NAME" \
            --artifact-id "$RENEWAL_ARTIFACT_ID" \
            --workflow .github/workflows/tuf-timestamp-renewal.yml \
            --head-branch main \
            --output "$RUNNER_TEMP/renewal-provenance.json"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ inputs.candidate_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: candidate
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ inputs.tuf_source_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.tuf_source_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: source-tuf
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ inputs.tuf_renewal_artifact_id }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.tuf_renewal_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: renewal
      - name: Verify immutable candidate and timestamp bytes
        env:
          EXPECTED_CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          EXPECTED_REPORT_SHA256: ${{ inputs.tuf_renewal_report_sha256 }}
          EXPECTED_KEY_ID: ${{ inputs.tuf_timestamp_key_id }}
        run: |
          set -euo pipefail
          actual="$(python3 -c 'import hashlib; print(hashlib.sha256(open("candidate/candidate.json", "rb").read()).hexdigest())')"
          test "$actual" = "$EXPECTED_CANDIDATE_SHA256"
          python3 maintenance/tools/release_candidate.py verify candidate
          actual_report="$(python3 -c 'import hashlib; print(hashlib.sha256(open("renewal/report.json", "rb").read()).hexdigest())')"
          test "$actual_report" = "$EXPECTED_REPORT_SHA256"
          mapfile -t catalogs < <(find source-tuf/targets -type f -name '*.catalog.json' -print | sort)
          test "${#catalogs[@]}" -eq 1
          cmp -s candidate/catalog.json "${catalogs[0]}"
          python3 maintenance/tools/verify_tuf_timestamp_renewal.py \
            --source-repository source-tuf \
            --renewed-repository renewal/repository \
            --report renewal/report.json \
            --root maintenance/trust/root.json \
            --catalog candidate/catalog.json \
            --expected-key-id "$EXPECTED_KEY_ID" \
            > "$RUNNER_TEMP/timestamp-renewal.json"
      - name: Verify every declared installer mirror before deployment
        run: |
          set -euo pipefail
          CANDIDATE_VERSION="$(python3 -c 'import json; print(json.load(open("candidate/candidate.json", encoding="utf-8"))["version"])')"
          python3 maintenance/tools/verify_release_mirrors.py \
            --candidate candidate \
            --catalog candidate/catalog.json \
            --expected-release "$CANDIDATE_VERSION"
      - name: Stage authenticated TUF from the renewal handoff without publishing new metadata
        run: |
          python3 maintenance/tools/publish_tuf_metadata.py \
            --metadata-dir renewal/repository \
            --root maintenance/trust/root.json \
            --catalog candidate/catalog.json \
            --stage-dir release-work/trust
      - name: Prepare the current release-truth projection overlay
        env:
          RELEASE_CODE_COMMIT: ${{ inputs.release_code_commit }}
          DEVELOPMENT_VALIDATE_RUN: ${{ inputs.development_validate_run }}
          RENEWAL_RUN_ID: ${{ inputs.tuf_renewal_run_id }}
        run: |
          set -euo pipefail
          python3 maintenance/tools/render_release_site.py \
            --source site/public \
            --catalog candidate/catalog.json \
            --product candidate/product.json \
            --bootstrap-source dist/installer/bin \
            --output release-work/current-site
          now="$(python3 -c 'from datetime import datetime, timezone; print(datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"))')"
          python3 maintenance/tools/project_release_truth.py \
            --source site/public/api/v1/release-truth.json \
            --candidate candidate \
            --trust-repository release-work/trust \
            --site-source release-work/current-site \
            --release-code-commit "$RELEASE_CODE_COMMIT" \
            --development-validate-run "$DEVELOPMENT_VALIDATE_RUN" \
            --observed-at "$now" \
            --renewal-run-id "$RENEWAL_RUN_ID" \
            --publication-run-id "$GITHUB_RUN_ID" \
            --output release-work/projection-overlay.json
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          source_projection = Path("release-work/site-source")
          # The frontend is one generation: HTML, CSS, JS, fonts and images all
          # come from the current release-code checkout. Candidate release data
          # was already bound by render_release_site and is overlaid again by
          # assemble_site_release below; using candidate visuals here creates a
          # hybrid page when the site's design changes between releases.
          shutil.copytree(Path("release-work/current-site"), source_projection)
          headers = source_projection / "_headers"
          headers.write_text(
              headers.read_text(encoding="utf-8")
              + "\n/api/v1/product.json\n  Cache-Control: no-store, no-cache, must-revalidate\n  CDN-Cache-Control: no-store\n  Access-Control-Allow-Origin: *\n\n/api/v1/release-truth.json\n  Cache-Control: no-store, no-cache, must-revalidate\n  CDN-Cache-Control: no-store\n  Access-Control-Allow-Origin: *\n",
              encoding="utf-8",
          )
          (source_projection / "api/v1/release-truth.json").write_bytes(
              Path("release-work/projection-overlay.json").read_bytes()
          )
          PY
      - name: Write deploy provenance endpoints into the overlay
        env:
          RELEASE_CODE_COMMIT: ${{ inputs.release_code_commit }}
          DEVELOPMENT_VALIDATE_RUN: ${{ inputs.development_validate_run }}
        run: |
          python3 maintenance/tools/build_deploy_provenance.py \
            --directory release-work/site-source \
            --commit "$RELEASE_CODE_COMMIT" \
            --validate-run-id "$DEVELOPMENT_VALIDATE_RUN" \
            --deploy-run-id "$GITHUB_RUN_ID" \
            --catalog candidate/catalog.json
      - name: Assemble verified site generation from current source overlay
        run: |
          mkdir -p release-work/site
          cp site/wrangler.jsonc release-work/site/wrangler.jsonc
          python3 maintenance/tools/assemble_site_release.py \
            --site-source release-work/site-source \
            --catalog candidate/catalog.json \
            --product candidate/product.json \
            --trust-repository release-work/trust \
            --output release-work/site/public
      - name: Dry-run the exact site generation
        working-directory: site
        run: |
          npm ci
          node_modules/.bin/wrangler deploy \
            --config ../release-work/site/wrangler.jsonc \
            --assets ../release-work/site/public \
            --dry-run
      - name: Deploy the projection repair (no release or TUF metadata publication)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          site/node_modules/.bin/wrangler deploy \
            --config release-work/site/wrangler.jsonc \
            --assets release-work/site/public \
            --strict
      - name: Verify public projection, TUF and owner-only audience
        env:
          RELEASE_CODE_COMMIT: ${{ inputs.release_code_commit }}
        run: |
          set -euo pipefail
          python3 maintenance/tools/verify_public_tuf.py \
            --root maintenance/trust/root.json \
            --catalog candidate/catalog.json
          python3 maintenance/tools/verify_public_bootstraps.py \
            --candidate candidate \
            --bootstrap-dir release-work/current-site
          python3 maintenance/tools/verify_public_product.py --candidate candidate
          for attempt in 1 2 3 4 5; do
            if python3 - <<'PY'
          import json
          import os
          import urllib.request

          probe_url = (
              "https://qw.x86.com.br/api/v1/release-truth.json?probe="
              + os.environ["GITHUB_RUN_ID"]
          )
          request = urllib.request.Request(
              probe_url,
              headers={
                  "Cache-Control": "no-cache",
                  "User-Agent": "x86qw-site-projection-repair/1",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise SystemExit(f"release-truth HTTP {response.status}")
              data = json.load(response)
          if data.get("snapshot_commit") != os.environ["RELEASE_CODE_COMMIT"]:
              raise SystemExit("live release-truth snapshot diverges from release code")
          if data.get("status", {}).get("external_public") != "NO-GO":
              raise SystemExit("live release-truth changed external-public status")
          if data.get("authorities", {}).get("candidate_release", {}).get("audience") != "owner-only":
              raise SystemExit("live release-truth lost owner-only audience")
          deployment = data.get("authorities", {}).get("deployment", {}).get("live_observation", {})
          if deployment.get("release_truth_endpoint") != "200":
              raise SystemExit("live release-truth does not record its verified endpoint")
          PY
            then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "live release-truth did not converge after ${attempt}/5 attempts" >&2
              exit 1
            fi
            delay=$((attempt * 5))
            echo "live release-truth not ready; retrying in ${delay}s (attempt ${attempt}/5)" >&2
            sleep "$delay"
          done
          python3 maintenance/tools/verify_site_root_probe.py \
            --assembled release-work/site/public/index.html \
            --live-url "https://qw.x86.com.br/?probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --report "$RUNNER_TEMP/root-probe.json"
          cp "$RUNNER_TEMP/root-probe.json" root-probe.json
      - name: Write immutable projection-repair receipt
        env:
          RELEASE_CODE_COMMIT: ${{ inputs.release_code_commit }}
          DEVELOPMENT_VALIDATE_RUN: ${{ inputs.development_validate_run }}
          CANDIDATE_COMMIT: ${{ inputs.candidate_commit }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          SOURCE_RUN_ID: ${{ inputs.tuf_source_run_id }}
          SOURCE_ARTIFACT_ID: ${{ inputs.tuf_source_artifact_id }}
          RENEWAL_RUN_ID: ${{ inputs.tuf_renewal_run_id }}
          RENEWAL_ARTIFACT_ID: ${{ inputs.tuf_renewal_artifact_id }}
          RENEWAL_REPORT_SHA256: ${{ inputs.tuf_renewal_report_sha256 }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          probe = json.loads(Path("root-probe.json").read_text(encoding="utf-8"))
          receipt = {
              "format": 1,
              "operation": "owner-only-site-projection-repair",
              "release_code_commit": os.environ["RELEASE_CODE_COMMIT"],
              "development_validate_run": int(os.environ["DEVELOPMENT_VALIDATE_RUN"]),
              "root_probe": probe,
              "candidate": {
                  "commit": os.environ["CANDIDATE_COMMIT"],
                  "run_id": int(os.environ["CANDIDATE_RUN_ID"]),
                  "artifact_id": int(os.environ["CANDIDATE_ARTIFACT_ID"]),
                  "artifact_name": os.environ["CANDIDATE_ARTIFACT_NAME"],
                  "candidate_sha256": os.environ["CANDIDATE_SHA256"],
                  "installer_sha256": "d3274e6aa2f1e3078ac5000ffae8b97c9efd329f3c2a87499bf1c57e5f388cb8",
              },
              "tuf": {
                  "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
                  "source_artifact_id": int(os.environ["SOURCE_ARTIFACT_ID"]),
                  "renewal_run_id": int(os.environ["RENEWAL_RUN_ID"]),
                  "renewal_artifact_id": int(os.environ["RENEWAL_ARTIFACT_ID"]),
                  "renewal_report_sha256": os.environ["RENEWAL_REPORT_SHA256"],
                  "publication": "none",
              },
              "publication": {
                  "release": "none",
                  "tuf": "none",
                  "site": "projection-only",
                  "workflow_run_id": int(os.environ["RELEASE_RUN_ID"]),
                  "workflow_run_attempt": int(os.environ["RELEASE_RUN_ATTEMPT"]),
              },
          }
          Path("projection-repair-receipt.json").write_text(
              json.dumps(receipt, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: site-projection-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            projection-repair-receipt.json
            root-probe.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90
