name: Report a bug
description: Report a reproducible failure in the installer, CLI, a game, a service or the portal.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Remove passwords, tokens, private IPs and personal paths. Vulnerabilities must use the private channel on the Security tab.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Install or bootstrap
        - CLI and lifecycle
        - ezQuake or gameplay
        - KTX and modes
        - Another game or mod
        - MVDSV / host
        - QTV
        - QWFWD / proxy
        - Portal or catalog
        - Maintenance / build / release
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: x86QW version
      description: Output of x86qw version or the installer version.
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "macOS 15 arm64, Ubuntu 24.04 amd64, Windows 11 x64..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior you saw and the result you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      placeholder: |
        1. Install the profile...
        2. Run...
        3. See...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnosis
      description: Attach or describe the result of `x86qw doctor --bundle`. The zip holds NOTICE.txt and doctor.json, already redacted. Do not include passwords, tokens or extra personal paths.
      render: shell
  - type: dropdown
    id: channel
    attributes:
      label: Client channel
      options:
        - Stable
        - Nightly
        - Both
        - Not applicable
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I searched the existing issues and did not find the same problem.
          required: true
        - label: I reviewed the content and removed credentials and personal data.
          required: true
        - label: This report does not describe a vulnerability that is not fixed yet.
          required: true
