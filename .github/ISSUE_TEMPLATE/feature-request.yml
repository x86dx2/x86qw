name: Suggest an improvement
description: Suggest a change to the product, the distribution, operations or the documentation.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Proposals for new components need to explain origin, license, consumer and how they will be maintained.
  - type: dropdown
    id: audience
    attributes:
      label: Who benefits?
      options:
        - Players
        - Hosts and operators
        - Distribution maintainers
        - Upstream developers
        - Everyone
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What concrete difficulty exists today? Avoid starting with the solution alone.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed result
      description: Describe the experience you want and an objective acceptance criterion.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Is there an existing solution in the CLI, upstream or outside the project?
  - type: textarea
    id: provenance
    attributes:
      label: Origin and license
      description: Required for clients, runtimes, games, mods, maps or outside assets. Include links and versions.
  - type: textarea
    id: validation
    attributes:
      label: Expected validation
      description: Which platforms, tests or smoke runs show that the proposal works?
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I looked for similar proposals in the roadmap and the issues.
          required: true
        - label: The proposal keeps updates explicit and published packages immutable.
          required: true
