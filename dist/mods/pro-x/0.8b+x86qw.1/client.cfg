// x86QW: controles e interface para Pro-X QW 0.8b.
// O perfil e carregado depois da configuracao pessoal do ezQuake.

alias prox_ready "ready"
alias prox_break "break"
alias prox_join "join"
alias prox_observe "observe"
alias prox_red "team red"
alias prox_blue "team blue"
alias prox_vote_yes "yes"
alias prox_admin_yes "agree"
alias prox_map1 "impulse 201"
alias prox_map2 "impulse 202"
alias prox_map3 "impulse 203"
alias prox_map4 "impulse 204"
alias prox_map5 "impulse 205"
alias x86qw_prox_help "echo ===== x86QW - Pro-X QW 0.8b =====;echo F1 voto SIM  F3 pronto  F4 pausa  F5 entrar;echo F6 observar  F7 time vermelho  F8 time azul  F10 ajuda"
alias prox_controls "x86qw_prox_help"

bind F1 "prox_vote_yes"
bind F3 "prox_ready"
bind F4 "prox_break"
bind F5 "prox_join"
bind F6 "prox_observe"
bind F7 "prox_red"
bind F8 "prox_blue"
bind F10 "x86qw_prox_help;commands"

scr_centertime "12"
hud_centerprint_draw "1"
hud_centerprint_show "1"
r_drawviewmodel "1"
cl_novweps "0"

exec x86qw-prox-user.cfg
x86qw_prox_help
