// x86QW: gameplay para Pro-X QW 1.1 sobre a configuracao base do nQuake.
// Preserva os impulses duplos do perfil historico e expoe os recursos reais do mod.

tempalias prox_vote_yes "yes"
tempalias prox_admin_yes "agree"
tempalias prox_ready "ready"
tempalias prox_break "break"
tempalias prox_join "join"
tempalias prox_observe "observe"
tempalias prox_red "team red"
tempalias prox_blue "team blue"
tempalias prox_menu "menu"
tempalias prox_id "id"
tempalias prox_hitsound "hitsound"
tempalias prox_death_messages "dth_msgmode"
tempalias prox_auto_screenshot "auto_screen"
tempalias prox_taunt "taunt"
tempalias prox_elect "elect"
tempalias prox_map1 "impulse 201"
tempalias prox_map2 "impulse 202"
tempalias prox_map3 "impulse 203"
tempalias prox_map4 "impulse 204"
tempalias prox_map5 "impulse 205"
tempalias x86qw_prox_help "echo ===== x86QW - Pro-X QW 1.1 =====;echo 1-0 armas  Q GL  E RL  Mouse2 LG  Roda troca arma;echo F1 voto SIM  F2 voto admin  F3 pronto  F4 pausa;echo F5 entrar  F6 observar  F7 vermelho  F8 azul  F9 menu;echo M menu  I identificacao  H som de acerto;echo Console: maplist, proxmap1-6, auto_screen, dth_msgmode, taunt;echo F10 ajuda e comandos"
tempalias prox_controls "x86qw_prox_help"

bind 1 "impulse 1;weapon 1"
bind 2 "impulse 2;weapon 2"
bind 3 "impulse 3;weapon 3"
bind 4 "impulse 4;weapon 4"
bind 5 "impulse 5;weapon 5"
bind 6 "impulse 6;weapon 6"
bind 7 "impulse 7;weapon 7"
bind 8 "impulse 8;weapon 8"
bind 9 "impulse 9"
bind 0 "impulse 10"

bind q "weapon 6"
bind e "weapon 7"
bind h "prox_hitsound"
bind i "prox_id"
bind m "prox_menu"
bind MOUSE1 "+attack"
bind MOUSE2 "weapon 8"
bind MOUSE4 "weapon 5 4"
bind MOUSE5 "weapon 3 2"
bind MWHEELUP "impulse 10"
bind MWHEELDOWN "impulse 12"

bind F1 "prox_vote_yes"
bind F2 "prox_admin_yes"
bind F3 "prox_ready"
bind F4 "prox_break"
bind F5 "prox_join"
bind F6 "prox_observe"
bind F7 "prox_red"
bind F8 "prox_blue"
bind F9 "prox_menu"
bind F10 "x86qw_prox_help;commands"

scr_centertime "12"
hud_centerprint_draw "1"
hud_centerprint_show "1"
r_drawviewmodel "1"
cl_novweps "0"

exec x86qw-prox-user.cfg
