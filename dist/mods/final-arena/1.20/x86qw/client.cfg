// x86QW: gameplay para Final Arena 1.20 sobre a configuracao base do nQuake.
// Os aliases abaixo correspondem aos impulses publicados pelo proprio gamecode.

tempalias arena_stats "impulse 68"
tempalias arena_position "impulse 69"
tempalias arena_break "impulse 70"
tempalias arena_commands "impulse 82"
tempalias arena_next "impulse 83"
tempalias arena_backpacks "impulse 85"
tempalias arena_status "impulse 86"
tempalias arena_airgib "impulse 88"
tempalias x86qw_arena_help "echo ===== x86QW - Final Arena 1.20 =====;echo 1-8 armas  Q GL  E RL  Mouse2 LG  Roda troca arma;echo F1 entrar  F2 fila  F3 estatisticas  F4 pausa;echo F5 proximo mapa  F6 status  F7 mochilas  F8 airgib;echo F10 ajuda e lista de comandos"
tempalias arena_controls "x86qw_arena_help"

bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"

bind q "impulse 6"
bind e "impulse 7"
bind MOUSE1 "+attack"
bind MOUSE2 "impulse 8"
bind MOUSE4 "impulse 5"
bind MOUSE5 "impulse 3"
bind MWHEELUP "impulse 10"
bind MWHEELDOWN "impulse 12"

bind F1 "join"
bind F2 "arena_position"
bind F3 "arena_stats"
bind F4 "arena_break"
bind F5 "arena_next"
bind F6 "arena_status"
bind F7 "arena_backpacks"
bind F8 "arena_airgib"
bind F10 "x86qw_arena_help;arena_commands"

scr_centertime "12"
hud_centerprint_draw "1"
hud_centerprint_show "1"
r_drawviewmodel "1"
cl_novweps "0"

exec x86qw-arena-user.cfg
