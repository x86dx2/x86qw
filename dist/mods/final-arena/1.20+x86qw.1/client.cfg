// x86QW: controles e interface para Final Arena 1.20.
// A configuracao geral do ezQuake continua ativa; somente recursos do mod sao ajustados aqui.

alias arena_stats "impulse 68"
alias arena_position "impulse 69"
alias arena_break "impulse 70"
alias arena_commands "impulse 82"
alias arena_next "impulse 83"
alias arena_backpacks "impulse 85"
alias arena_status "impulse 86"
alias arena_airgib "impulse 88"
alias x86qw_arena_help "echo ===== x86QW - Final Arena 1.20 =====;echo 1-8 selecionar armas;echo F3 estatisticas  F4 posicao na fila  F5 pausa;echo F7 proximo mapa  F8 status  F10 ajuda e comandos"
alias arena_controls "x86qw_arena_help"

bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"

bind F3 "arena_stats"
bind F4 "arena_position"
bind F5 "arena_break"
bind F7 "arena_next"
bind F8 "arena_status"
bind F10 "x86qw_arena_help;arena_commands"

scr_centertime "12"
hud_centerprint_draw "1"
hud_centerprint_show "1"
r_drawviewmodel "1"
cl_novweps "0"

exec x86qw-arena-user.cfg
x86qw_arena_help
