// x86QW: controles do Team Fortress 2.8 preservados pelo nQuake.

alias x86qw_fortress_help "echo ===== x86QW - Team Fortress 2.8 =====;echo 1-8 selecionar armas da classe;echo C detonar 50  X detonar 20  Z detonar 5  R recarregar;echo Mouse2 granada 1  Mouse3 granada 2  Shift especial;echo Alt bandeira  Ctrl descartar  F pedir medico  F10 ajuda"

bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"

bind c "+det50"
bind f "saveme"
bind r "reload"
bind x "+det20"
bind z "+det5"
bind MOUSE2 "+gren1"
bind MOUSE3 "+gren2"
bind ALT "flaginfo"
bind CTRL "discard"
bind SHIFT "special"
bind F10 "x86qw_fortress_help"

exec x86qw-fortress-user.cfg
x86qw_fortress_help
