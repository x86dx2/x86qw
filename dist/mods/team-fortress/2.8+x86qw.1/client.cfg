// x86QW: controles do Team Fortress 2.8 preservados pelo nQuake.

alias x86qw_fortress_help "echo ===== x86QW - Team Fortress 2.8 =====;echo C detonar 50  X detonar 20  Z detonar 5  R recarregar;echo Mouse2 granada 1  Mouse3 granada 2  Shift especial;echo Alt bandeira  Ctrl descartar  F pedir medico  F10 ajuda"

bind c "+det50"
bind f "saveme"
bind r "reload"
bind x "+det20"
bind z "+det5"
bind MOUSE2 "+gren1"
bind MOUSE3 "+gren2"
bind ALT "flaginfo"
bind CTRL "discard"
bind SHIFT "special"
bind F10 "x86qw_fortress_help"

exec x86qw-fortress-user.cfg
x86qw_fortress_help
