// x86QW: apenas cvars exigidas pelas mecanicas do Team Fortress 2.9.
// A expansao ocorre dentro do alias; uma atribuicao direta preservaria o texto
// literal "$cl_remote_capabilities" e removeria as permissoes seguras padrao.
// O gamecode x86QW nao envia binds remotos.
tempalias x86qw_tf_allow_legacy_cvars "cl_remote_capabilities $cl_remote_capabilities,cl_movespeedkey,fov,v_cshift,v_idlescale"
x86qw_tf_allow_legacy_cvars
