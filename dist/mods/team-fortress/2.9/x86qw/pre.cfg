// x86QW: only the cvars the Team Fortress 2.9 mechanics need.
// The expansion happens inside the alias; a direct assignment would keep the
// literal text "$cl_remote_capabilities" and drop the safe default permissions.
// The x86QW gamecode sends no remote binds.
tempalias x86qw_tf_allow_legacy_cvars "cl_remote_capabilities $cl_remote_capabilities,cl_movespeedkey,fov,v_cshift,v_idlescale"
x86qw_tf_allow_legacy_cvars
