// x86QW: Team Fortress 2.9 gameplay over the nQuake base configuration.
// Keeps the official binds of the nQuake addon and adds access to the mod menus.

tempalias x86qw_fortress_help "echo ===== x86QW - Team Fortress 2.9 =====;echo 1-0 weapons and class menus;echo Mouse2/Mouse3 grenades  Shift special  R reload;echo C detpack 50s  X 20s  Z 5s;echo Alt flag  Ctrl discard  F call a medic;echo F1 inventory  F2 classes  F3 change class  F4 map help;echo F5 flag  F6 medic  F7 discard  F8 reload;echo F9 special  F10 help  F12 quit"
tempalias fortress_controls "x86qw_fortress_help"

bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"
bind 9 "impulse 9"
bind 0 "impulse 10"

bind c "+det50"
bind f "saveme"
bind r "reload"
bind x "+det20"
bind z "+det5"
bind MOUSE1 "+attack"
bind MOUSE2 "+gren1"
bind MOUSE3 "+gren2"
bind ALT "flaginfo"
bind CTRL "discard"
bind SHIFT "special"

bind F1 "inv"
bind F2 "showclasses"
bind F3 "changeclass"
bind F4 "maphelp"
bind F5 "flaginfo"
bind F6 "saveme"
bind F7 "discard"
bind F8 "reload"
bind F9 "special"
bind F10 "x86qw_fortress_help"

// Pro-X, Final Arena and TD2 lengthen centerprints, and the global config
// keeps the last value: restore ezQuake's default.
scr_centertime "2"

if $x86qw_ruleset == 1 "exec x86qw-ruleset.cfg"
x86qw_fortress_help
exec x86qw-fortress-user.cfg
bind F12 "quit"
