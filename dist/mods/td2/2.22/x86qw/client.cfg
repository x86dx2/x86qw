// x86QW: controles e interface para Total Destruction 2.
// A configuracao geral do ezQuake continua ativa; somente recursos do TD2 sao ajustados aqui.

alias td2_magic "impulse 1"
alias td2_special "impulse 20"
alias td2_vote_yes "impulse 21"
alias td2_drop_rune "impulse 22"
alias td2_drop_special "impulse 23"
alias x86qw_td2_help "echo ===== x86QW - Total Destruction 2.22 =====;echo 1 magia  2-8 armas  9 especial  0 voto SIM;echo Q arma 6  E arma 7  Z largar runa  X largar especial;echo Mouse2 arma 8  Mouse4 magia  Mouse5 especial;echo Roda trocar arma  F10 ajuda"
alias td2_controls "x86qw_td2_help"

bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"
bind 9 "impulse 20"
bind 0 "impulse 21"
bind q "impulse 6"
bind e "impulse 7"
bind z "impulse 22"
bind x "impulse 23"
bind MOUSE1 "+attack"
bind MOUSE2 "impulse 8"
bind MOUSE4 "impulse 1"
bind MOUSE5 "impulse 20"
bind MWHEELUP "impulse 10"
bind MWHEELDOWN "impulse 12"
bind F10 "x86qw_td2_help"

scr_centertime "20"
hud_centerprint_draw "1"
hud_centerprint_show "1"
r_drawviewmodel "1"
cl_novweps "0"

exec x86qw-td2-user.cfg
x86qw_td2_help
