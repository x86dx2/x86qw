// x86QW: gameplay para Total Destruction 2.22 sobre a configuracao base do nQuake.
// Os binds seguem o manual e o gamecode original: 1 magia, 9 especial e 0 voto SIM.

tempalias td2_magic "impulse 1"
tempalias td2_special "impulse 20"
tempalias td2_vote_yes "impulse 21"
tempalias td2_drop_rune "impulse 22"
tempalias td2_drop_special "impulse 23"
tempalias td2_vote_next "impulse 100"
tempalias td2_vote_dm2 "impulse 152"
tempalias td2_vote_dm4 "impulse 154"
tempalias td2_vote_dm6 "impulse 156"
tempalias td2_vote_aerowalk "impulse 187"
tempalias x86qw_td2_help "echo ===== x86QW - Total Destruction 2.22 =====;echo 1 magia  2-8 armas  9 arma especial  0 voto SIM;echo Q GL  E RL  Mouse2 arma 8  Roda troca arma;echo Mouse4 magia  Mouse5 especial  Z largar runa  X largar especial;echo F1 proximo mapa  F2 largar runa  F3 largar especial;echo F4 DM2  F5 DM4  F6 DM6  F7 Aerowalk;echo F10 ajuda  F12 sair"
tempalias td2_controls "x86qw_td2_help"

bind 1 "impulse 1"
bind 2 "impulse 2"
bind 3 "impulse 3"
bind 4 "impulse 4"
bind 5 "impulse 5"
bind 6 "impulse 6"
bind 7 "impulse 7"
bind 8 "impulse 8"
bind 9 "impulse 20"
bind 0 "impulse 21"

bind q "impulse 6"
bind e "impulse 7"
bind z "td2_drop_rune"
bind x "td2_drop_special"
bind MOUSE1 "+attack"
bind MOUSE2 "impulse 8"
bind MOUSE4 "td2_magic"
bind MOUSE5 "td2_special"
bind MWHEELUP "impulse 10"
bind MWHEELDOWN "impulse 12"

bind F1 "td2_vote_next"
bind F2 "td2_drop_rune"
bind F3 "td2_drop_special"
bind F4 "td2_vote_dm2"
bind F5 "td2_vote_dm4"
bind F6 "td2_vote_dm6"
bind F7 "td2_vote_aerowalk"
bind F10 "x86qw_td2_help"

scr_centertime "20"
hud_centerprint_draw "1"
hud_centerprint_show "1"
r_drawviewmodel "1"
cl_novweps "0"

if $x86qw_ruleset == 1 "exec x86qw-ruleset.cfg"
x86qw_td2_help
exec x86qw-td2-user.cfg
bind F12 "quit"
