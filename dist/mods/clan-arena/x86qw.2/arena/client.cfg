// x86QW: controles e interface para Final Arena 1.20.
// A configuracao geral do ezQuake continua ativa; somente recursos do mod sao ajustados aqui.

alias arena_stats "impulse 68"
alias arena_position "impulse 69"
alias arena_break "impulse 70"
alias arena_commands "impulse 82"
alias arena_next "impulse 83"
alias arena_backpacks "impulse 85"
alias arena_status "impulse 86"
alias arena_airgib "impulse 88"
alias arena_controls "echo Arena: F3 estatisticas, F4 posicao na fila, F5 pausa;echo Arena: F7 proximo mapa, F8 status, F10 ajuda"

bind F3 "arena_stats"
bind F4 "arena_position"
bind F5 "arena_break"
bind F7 "arena_next"
bind F8 "arena_status"
bind F10 "arena_controls;arena_commands"

scr_centertime "12"
hud_centerprint_draw "1"
hud_centerprint_show "1"
r_drawviewmodel "1"
cl_novweps "0"

exec x86qw-arena-user.cfg
arena_controls
