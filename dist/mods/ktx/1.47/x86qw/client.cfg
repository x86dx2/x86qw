// x86QW: gameplay competitivo KTX sobre a configuracao base do nQuake.
// Reaplica o mapa de teclas nQuake apos outros mods e carrega o usuario por ultimo.
// O servidor local do ezQuake nao implementa o profiling opcional do MVDSV.
tempalias sv_enableprofile ""

tempalias x86qw_ktx_help "echo ===== x86QW - KTX 1.47 / controles nQuake =====;echo 1 quad morto  5 inimigo com powerup;echo 2 SG  3 SSG  4 NG/SNG  Q GL  E RL;echo Mouse2 LG  Mouse4 NG/SNG  Mouse5 SG/SSG;echo C chegando  F seguro  G ajuda  R apontar  T perdido  V substituir;echo Ctrl peguei item  Shift status  Roda ajusta timer;echo F1/F2 pegar quad/pent  F3/F4 timers  F5 pronto  F6 pausa;echo F7 entrar  F8 observar  F9 servidores  F10 ajuda"
tempalias ktx_controls "x86qw_ktx_help"

bind 0 ""
bind 1 "tp_msgquaddead"
bind 2 "weapon 2 1"
bind 3 "weapon 3 2"
bind 4 "weapon 5 4"
bind 5 "tp_msgenemypwr"
bind 6 ""
bind 7 ""
bind 8 ""
bind 9 ""

bind c "tp_msgcoming"
bind e "weapon 7"
bind f "tp_msgsafe"
bind g "tp_msghelp"
bind h ""
bind i ""
bind m ""
bind q "weapon 6"
bind r "tp_msgpoint; shownick"
bind t "tp_msglost"
bind v "tp_msgreplace"
bind x ""
bind z ""

bind ALT ""
bind CTRL "tp_msgtook"
bind SHIFT "tp_msgreport"
bind MOUSE1 "+attack"
bind MOUSE2 "weapon 8"
bind MOUSE3 ""
bind MOUSE4 "weapon 5 4"
bind MOUSE5 "weapon 3 2"
bind MWHEELUP "time_inc"
bind MWHEELDOWN "time_dec"

bind F1 "tp_msggetquad"
bind F2 "tp_msggetpent"
bind F3 "tp_custom_getquadtimer"
bind F4 "tp_custom_getpenttimer"
bind F5 "toggleready"
bind F6 "break"
bind F7 "join"
bind F8 "observe"
bind F9 "menu_slist"
bind F10 "x86qw_ktx_help"

exec x86qw-ktx-user.cfg
