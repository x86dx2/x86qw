// x86QW: atalhos locais para partidas KTX.

alias ktx_vote_yes "yes"
alias ktx_ready "ready"
alias ktx_break "break"
alias ktx_join "join"
alias ktx_observe "observe"
alias ktx_red "team red"
alias ktx_blue "team blue"
alias x86qw_ktx_help "echo ===== x86QW - KTX 1.47 =====;echo F1 voto SIM  F3 pronto  F4 pausa  F5 entrar;echo F6 observar  F7 time vermelho  F8 time azul  F10 ajuda"

bind F1 "ktx_vote_yes"
bind F3 "ktx_ready"
bind F4 "ktx_break"
bind F5 "ktx_join"
bind F6 "ktx_observe"
bind F7 "ktx_red"
bind F8 "ktx_blue"
bind F10 "x86qw_ktx_help"

exec x86qw-ktx-user.cfg
x86qw_ktx_help
