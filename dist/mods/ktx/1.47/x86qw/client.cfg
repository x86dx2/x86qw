// x86QW: gameplay competitivo KTX sobre a configuracao base do nQuake.
// Mantem as comunicacoes do nQuake, libera 1-8 para armas e carrega o usuario por ultimo.

alias x86qw_ktx_axe "weapon 1"
alias x86qw_ktx_sg "weapon 2 1"
alias x86qw_ktx_ssg "weapon 3 2 1"
alias x86qw_ktx_ng "weapon 4 2 1"
alias x86qw_ktx_sng "weapon 5 4 2 1"
alias x86qw_ktx_gl "weapon 6 5 3 2 4 1"
alias x86qw_ktx_rl "weapon 7 6 5 3 2 4 1"
alias x86qw_ktx_lg "weapon 8 5 3 2 4 1"

alias x86qw_ktx_help "echo ===== x86QW - KTX 1.47 =====;echo 1-8 armas  Q GL  E RL  Mouse2 LG  Mouse4 NG/SNG  Mouse5 SG/SSG;echo Z quad morto  X inimigo com powerup;echo C chegando  F seguro  G ajuda  R apontar  T perdido  V substituir;echo Ctrl peguei item  Shift status;echo F1/F2 pegar quad/pent  F3/F4 timers  F5 pronto  F6 pausa;echo F7 entrar  F8 observar  F10 ajuda"
alias ktx_controls "x86qw_ktx_help"

bind 1 "x86qw_ktx_axe"
bind 2 "x86qw_ktx_sg"
bind 3 "x86qw_ktx_ssg"
bind 4 "x86qw_ktx_ng"
bind 5 "x86qw_ktx_sng"
bind 6 "x86qw_ktx_gl"
bind 7 "x86qw_ktx_rl"
bind 8 "x86qw_ktx_lg"

bind q "x86qw_ktx_gl"
bind e "x86qw_ktx_rl"
bind z "tp_msgquaddead"
bind x "tp_msgenemypwr"
bind MOUSE1 "+attack"
bind MOUSE2 "x86qw_ktx_lg"
bind MOUSE4 "x86qw_ktx_sng"
bind MOUSE5 "x86qw_ktx_ssg"

bind F1 "tp_msggetquad"
bind F2 "tp_msggetpent"
bind F3 "tp_custom_getquadtimer"
bind F4 "tp_custom_getpenttimer"
bind F5 "toggleready"
bind F6 "break"
bind F7 "join"
bind F8 "observe"
bind F10 "x86qw_ktx_help"

exec x86qw-ktx-user.cfg
x86qw_ktx_help
