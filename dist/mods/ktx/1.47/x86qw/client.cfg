// x86QW: gameplay competitivo KTX sobre a configuracao base do nQuake.
// Aplica o mapa de teclas nQuake somente ao KTX e carrega o usuario por ultimo.
// O servidor local do ezQuake nao implementa o profiling opcional do MVDSV.
tempalias sv_enableprofile ""

// Mensagem original do autoexec nQuake, reativada exclusivamente ao iniciar KTX.
tempalias x86qw_ktx_startup_1  "echo Welcome to ^n^Q^u^a^k^e!"
tempalias x86qw_ktx_startup_2  "echo To find a game, press [^E^S^C] and select ^M^u^l^t^i^p^l^a^y^e^r!"
tempalias x86qw_ktx_startup_3  "echo Helpful commands:"
tempalias x86qw_ktx_startup_4  "echo ^/^l^i^s^t* $x20$x20$x20 - aliases that list different assets available"
tempalias x86qw_ktx_startup_5  "echo ^b^o^t^s$x20$x20$x20$x20$x20$x20 - instructions on how to play against bots"
tempalias x86qw_ktx_startup_6  "echo ^c^r^o^s^s^h^a^i^r^s - view a list of crosshairs"
tempalias x86qw_ktx_startup_7  "echo ^c^o^n^c^h^a^r^s$x20$x20 - view a list of console characters"
tempalias x86qw_ktx_startup_8  "echo ^g^r^a^p^h^i^c^s$x20$x20 - view a list of graphic settings"
tempalias x86qw_ktx_startup_9  "echo ^t^e^a^m^s^a^y^s$x20$x20 - view a list of teamsay binds"
tempalias x86qw_ktx_startup_10 "echo ^w^e^a^p^o^n^s$x20$x20$x20 - view a list of quick weapon binds"
tempalias x86qw_ktx_startup_11 "echo For additional help, type ^h^e^l^p, or ^d^e^s^c^r^i^b^e [command]"
tempalias x86qw_ktx_startup_12 "echo To search for a command, type ^c^v^a^r^l^i^s^t *[keyword]*,;echo for example ^c^v^a^r^l^i^s^t ^*^s^k^i^n^*"
tempalias x86qw_ktx_startup "_draw_line;x86qw_ktx_startup_1;echo;x86qw_ktx_startup_2;echo;x86qw_ktx_startup_3;x86qw_ktx_startup_4;x86qw_ktx_startup_5;x86qw_ktx_startup_6;x86qw_ktx_startup_7;x86qw_ktx_startup_8;x86qw_ktx_startup_9;x86qw_ktx_startup_10;echo;x86qw_ktx_startup_11;echo;x86qw_ktx_startup_12;_draw_line;echo"

// F10 apresenta o mapa completo herdado do nQuake em blocos legiveis.
tempalias x86qw_ktx_help_move "echo ^M^O^V^I^M^E^N^T^O ^E ^I^N^T^E^R^F^A^C^E;echo ^W / ^S - frente / tras;echo ^A / ^D - esquerda / direita;echo ^S^P^A^C^E - pular;echo ^M^O^U^S^E^1 - atacar;echo ^T^A^B - placar das equipes;echo ^E^N^T^E^R / ^U - chat geral;echo ^Y - chat da equipe;echo ^E^S^C - menu;echo ^` / ^~ - console;echo ^/ - lista de jogadores observaveis;echo ^F^1^2 - screenshot"
tempalias x86qw_ktx_help_weapons "echo ^A^R^M^A^S;echo ^2 - shotgun / axe;echo ^3 - super shotgun / shotgun;echo ^4 - super nailgun / nailgun;echo ^Q - grenade launcher;echo ^E - rocket launcher;echo ^M^O^U^S^E^2 - lightning gun;echo ^M^O^U^S^E^4 - super nailgun / nailgun;echo ^M^O^U^S^E^5 - shotgun / super shotgun"
tempalias x86qw_ktx_help_team "echo ^C^O^M^U^N^I^C^A^C^A^O ^D^E ^E^Q^U^I^P^E;echo ^1 - quad morto;echo ^5 - inimigo com powerup;echo ^C - chegando;echo ^F - local seguro;echo ^G - pedir ajuda;echo ^R - apontar item / mostrar jogador;echo ^T - perdido;echo ^V - pedir substituicao;echo ^C^T^R^L - item coletado;echo ^S^H^I^F^T - relatorio de status;echo ^F^1 - pegar quad;echo ^F^2 - pegar pent"
tempalias x86qw_ktx_help_match "echo ^P^A^R^T^I^D^A ^E ^T^I^M^E^R^S;echo ^M^W^H^E^E^L^U^P / ^M^W^H^E^E^L^D^O^W^N - ajustar timer;echo ^F^3 / ^F^4 - informar timers de quad / pent;echo ^F^5 - ready;echo ^F^6 / ^P^G^D^N - break;echo ^P^G^U^P - ready;echo ^F^7 - entrar;echo ^F^8 - observar;echo ^F^9 - servidores;echo ^K^P^_^S^T^A^R - salvar partida;echo ^P^A^U^S^E - menu do proxy"
tempalias x86qw_ktx_help_util "echo ^U^T^I^L^I^T^A^R^I^O^S;echo ^[ / ^] - diminuir / aumentar volume;echo ^R^S^H^I^F^T - enviar sorriso;echo ^F^1^0 - esta ajuda"
tempalias x86qw_ktx_help_demo "echo ^D^E^M^O^S ^N^O ^T^E^C^L^A^D^O ^N^U^M^E^R^I^C^O;echo ^K^P^_^E^N^T^E^R - placar;echo ^K^P^_^H^O^M^E / ^K^P^_^L^E^F^T - mais lento;echo ^K^P^_^5 - velocidade normal;echo ^K^P^_^R^I^G^H^T / ^K^P^_^P^G^D^N - mais rapido;echo ^K^P^_^U^P / ^K^P^_^D^O^W^N - pausar;echo ^K^P^_^E^N^D - camera lenta;echo ^K^P^_^P^G^U^P - velocidade maxima;echo ^K^P^_^M^I^N^U^S / ^K^P^_^P^L^U^S - volume"
tempalias x86qw_ktx_help "_draw_line;echo ^x^8^6^Q^W ^- ^K^T^X ^1^.^4^7 ^- ^C^O^N^T^R^O^L^E^S;echo;x86qw_ktx_help_move;echo;x86qw_ktx_help_weapons;echo;x86qw_ktx_help_team;echo;x86qw_ktx_help_match;echo;x86qw_ktx_help_util;echo;x86qw_ktx_help_demo;echo;echo Digite ^k^t^x^_^m^o^d^e para consultar novamente o preset ativo:;ktx_mode;_draw_line"
tempalias ktx_controls "x86qw_ktx_help"

bind 0 ""
bind 1 "tp_msgquaddead"
bind 2 "weapon 2 1"
bind 3 "weapon 3 2"
bind 4 "weapon 5 4"
bind 5 "tp_msgenemypwr"
bind 6 ""
bind 7 ""
bind 8 ""
bind 9 ""

bind c "tp_msgcoming"
bind e "weapon 7"
bind f "tp_msgsafe"
bind g "tp_msghelp"
bind h ""
bind i ""
bind m ""
bind q "weapon 6"
bind r "tp_msgpoint; shownick"
bind t "tp_msglost"
bind v "tp_msgreplace"
bind x ""
bind z ""

bind ALT ""
bind CTRL "tp_msgtook"
bind SHIFT "tp_msgreport"
bind MOUSE1 "+attack"
bind MOUSE2 "weapon 8"
bind MOUSE3 ""
bind MOUSE4 "weapon 5 4"
bind MOUSE5 "weapon 3 2"
bind MWHEELUP "time_inc"
bind MWHEELDOWN "time_dec"

bind F1 "tp_msggetquad"
bind F2 "tp_msggetpent"
bind F3 "tp_custom_getquadtimer"
bind F4 "tp_custom_getpenttimer"
bind F5 "toggleready"
bind F6 "break"
bind F7 "join"
bind F8 "observe"
bind F9 "menu_slist"
bind F10 "toggleconsole;x86qw_ktx_help"

x86qw_ktx_startup
exec x86qw-ktx-user.cfg
