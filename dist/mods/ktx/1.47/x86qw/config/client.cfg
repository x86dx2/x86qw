// x86QW: gameplay competitivo KTX sobre a configuracao base do nQuake.
// Aplica o mapa de teclas nQuake somente ao KTX e carrega o usuario por ultimo.
// O servidor local do ezQuake nao implementa o profiling opcional do MVDSV.
tempalias sv_enableprofile ""

// F10 executa uma ajuda em linhas simples para respeitar o limite do console.
tempalias ktx_controls "scr_consize 0.8;toggleconsole;exec x86qw-ktx-help.cfg"
// O launcher troca somente os aliases contextuais; os binds continuam antes
// do arquivo pessoal, que pode sobrescrevê-los sem ser alterado pelo x86QW.
tempalias x86qw_ktx_key_f5 "toggleready"
tempalias x86qw_ktx_key_f6 "break"
tempalias x86qw_ktx_key_h ""
tempalias x86qw_ktx_key_i ""
tempalias x86qw_ktx_key_m ""
tempalias x86qw_ktx_key_x ""
tempalias x86qw_ktx_key_z ""
tempalias x86qw_ktx_key_f11 "cmd rules"
tempalias x86qw_ktx_key_help_f5 "echo ^F^5$x20$x7c$x20ready"
tempalias x86qw_ktx_key_help_f6 "echo ^F^6$x20$x7c$x20break"
tempalias x86qw_ktx_key_help_h ""
tempalias x86qw_ktx_key_help_i ""
tempalias x86qw_ktx_key_help_m ""
tempalias x86qw_ktx_key_help_x ""
tempalias x86qw_ktx_key_help_z ""
tempalias x86qw_ktx_key_help_f11 "echo ^F^1^1$x20$x7c$x20mostrar regras"
tempalias x86qw_ktx_key_help "echo;echo ^T^E^C^L^A^S$x20^D^O$x20^M^O^D^O;x86qw_ktx_key_help_f5;x86qw_ktx_key_help_f6;x86qw_ktx_key_help_h;x86qw_ktx_key_help_i;x86qw_ktx_key_help_m;x86qw_ktx_key_help_x;x86qw_ktx_key_help_z;x86qw_ktx_key_help_f11"
tempalias x86qw_ktx_bot_add "echo Nenhum perfil Frogbot ativo nesta sessao"
tempalias x86qw_ktx_bot_remove "echo Nenhum perfil Frogbot ativo nesta sessao"
tempalias x86qw_ktx_bot_skill_down "echo Nenhum perfil Frogbot ativo nesta sessao"
tempalias x86qw_ktx_bot_skill_up "echo Nenhum perfil Frogbot ativo nesta sessao"
tempalias x86qw_ktx_bot_help ""
tempalias x86qw_ktx_mode_help "x86qw_ktx_key_help;x86qw_ktx_bot_help"

bind 0 ""
bind 1 "tp_msgquaddead"
bind 2 "weapon 2 1"
bind 3 "weapon 3 2"
bind 4 "weapon 5 4"
bind 5 "tp_msgenemypwr"
bind 6 ""
bind 7 ""
bind 8 ""
bind 9 ""

bind c "tp_msgcoming"
bind e "weapon 7"
bind f "tp_msgsafe"
bind g "tp_msghelp"
bind h "x86qw_ktx_key_h"
bind i "x86qw_ktx_key_i"
bind m "x86qw_ktx_key_m"
bind q "weapon 6"
bind r "tp_msgpoint; shownick"
bind t "tp_msglost"
bind v "tp_msgreplace"
bind x "x86qw_ktx_key_x"
bind z "x86qw_ktx_key_z"

bind ALT ""
bind CTRL "tp_msgtook"
bind SHIFT "tp_msgreport"
bind MOUSE1 "+attack"
bind MOUSE2 "weapon 8"
bind MOUSE3 ""
bind MOUSE4 "weapon 5 4"
bind MOUSE5 "weapon 3 2"
bind MWHEELUP "time_inc"
bind MWHEELDOWN "time_dec"

bind F1 "tp_msggetquad"
bind F2 "tp_msggetpent"
bind F3 "tp_custom_getquadtimer"
bind F4 "tp_custom_getpenttimer"
bind F5 "x86qw_ktx_key_f5"
bind F6 "x86qw_ktx_key_f6"
bind F7 "join"
bind F8 "observe"
bind F9 "menu_slist"
bind F10 "ktx_controls"
bind F11 "x86qw_ktx_key_f11"
bind INS "x86qw_ktx_bot_add"
bind DEL "x86qw_ktx_bot_remove"
bind HOME "x86qw_ktx_bot_skill_down"
bind END "x86qw_ktx_bot_skill_up"

if $x86qw_ruleset == 1 "exec x86qw-ruleset.cfg"
exec x86qw-ktx-user.cfg
bind F12 "quit"
