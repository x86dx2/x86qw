// x86QW Ruleset: diversao assistida sobre o ruleset default do ezQuake.
// O launcher aplica este perfil apenas quando a experiencia x86qw esta ativa.

allow_scripts "2"
cl_iDrive "1"
cl_smartjump "1"
cl_safestrafe "0"

m_filter "0"
m_accel "0"

cl_weaponpreselect "0"
cl_weaponhide "0"
b_switch "2"
w_switch "2"

cl_bonusflash "1"
v_damagecshift "0.2"
gl_powerupshells "1"
r_powerupGlow "1"
hud_speed_show "1"
hud_healthdamage_show "1"
hud_armordamage_show "1"

cl_confirmquit "1"
cfg_backup "1"
cfg_save_onquit "1"

tempalias x86qw_rocketjump "impulse 164;+jump;wait;-jump"
bind SPACE "+jump"
bind MWHEELUP "+jump"
bind MWHEELDOWN "+jump"
bind MOUSE3 "x86qw_rocketjump"
